function record(){return saved.lessons[course[index].id]||(saved.lessons[course[index].id]={page:0,time:0,note:'',done:false})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));storeOK=true;}catch(e){storeOK=false;$('saveState').textContent='浏览器未允许本地保存，请导出笔记或备份。'}}
function toast(t){$('status').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('status').textContent='',4500)}
function snapshot(){const r=record();r.page=page;if(audio.readyState)r.time=audio.currentTime;saved.last=index;persist()}
function directory(){const query=$('search').value.trim().toLowerCase();let html='';for(const unit of [...new Set(course.map(c=>c.unit))]){const list=course.map((c,i)=>({c,i})).filter(({c})=>c.unit===unit&&(!query||[c.id,c.title,c.chapter,c.unit,...c.pages.map(p=>p.text)].join(' ').toLowerCase().includes(query)));if(!list.length)continue;html+='<details class="group" open><summary>'+esc(unit)+'</summary>';for(const{c,i}of list){const done=saved.lessons[c.id]?.done;html+=`<button class="lesson ${i===index?'active':''}" data-lesson="${i}" ${i===index?'aria-current="true"':''}><span class="code">${c.id}</span><span>${esc(c.title)}</span>${done?'<span class="check" aria-label="已完成">✓</span>':''}</button>`;}html+='</details>'}$('directory').innerHTML=html||'<div class="empty">没有找到相应内容，请换一个关键词。</div>';const n=course.filter(c=>saved.lessons[c.id]?.done).length;$('progressText').textContent=`${n} / 24 讲`;$('progressBar').style.width=(n/24*100)+'%'}
function setTab(which){const note=which==='notes';$('scriptPanel').hidden=note;$('notesPanel').hidden=!note;$('scriptTab').setAttribute('aria-selected',!note);$('notesTab').setAttribute('aria-selected',note)}
function cleanNotes(text){return text.split(/\n(?:来源|证据|对应片段|source_revision)/)[0].trim()}
function renderPage(){const c=course[index],p=c.pages[page];$('slide').src=p.image;$('slide').alt=`${c.id} ${c.title} · 第${page+1}页：${p.title}`;$('pageTitle').textContent=p.title;$('transcript').textContent=cleanNotes(p.notes)||p.text;$('pageSelect').value=String(page);$('fullCount').textContent=`${page+1} / ${c.pages.length}`;for(const id of ['prevPage','fullPrev'])$(id).disabled=page===0;for(const id of ['nextPage','fullNext'])$(id).disabled=page===c.pages.length-1;$('pages').querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',j===page);b.setAttribute('aria-current',j===page?'true':'false')});record().page=page;persist();}
function seekMedia(el,time,play=false){const set=()=>{el.currentTime=Math.max(0,Math.min(time,Number.isFinite(el.duration)?el.duration-.05:time));if(play)el.play().catch(()=>toast('请点击播放器的播放按钮开始收听。'))};if(el.readyState>=1)set();else el.addEventListener('loadedmetadata',set,{once:true})}
function selectLesson(n,options={}){if(n<0||n>=course.length)return;if(audio.src)snapshot();audio.pause();index=n;const c=course[index],r=record();page=Number.isInteger(r.page)?Math.max(0,Math.min(r.page,c.pages.length-1)):0;if(options.start)page=0;activeSegment=null;suppressFollow=false;
 $('lessonCode').textContent=`${c.id} · ${c.unit}`;$('chapter').textContent=c.chapter;$('duration').textContent=fmt(c.duration);$('lessonTitle').textContent=c.title;$('note').value=r.note||'';$('exercises').textContent=c.exercises||'请结合本讲应用练习，记录你的工作问题、观察结果与下一步行动。';$('source').textContent='原书范围：'+c.source;$('audit').textContent='资料状态：'+c.status;$('timing').textContent=c.timingNote;$('downloadAudio').href=c.audio;$('downloadPpt').href=c.ppt;$('prevLesson').disabled=n===0;$('nextLesson').disabled=n===course.length-1;$('complete').textContent=r.done?'已完成 · 点击取消':'标记本讲完成';
 $('pageSelect').innerHTML=c.pages.map((p,j)=>`<option value="${j}">${j+1} / ${c.pages.length} · ${esc(p.title)}</option>`).join('');$('pages').innerHTML=c.pages.map((p,j)=>`<button class="page-link" data-page="${j}"><span class="number">${String(j+1).padStart(2,'0')}</span><span>${esc(p.title)}<small>${fmt(p.time)}${p.segment?' · 片段'+p.segment:''}</small></span></button>`).join('');
 audio.src=c.audio;audio.load();audio.playbackRate=Number(saved.speed)||1;seekMedia(audio,options.start?0:Number(r.time)||0,!!options.play);directory();renderPage();saved.last=index;persist();$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');if(!storeOK)$('saveState').textContent='浏览器未允许本地保存，请导出笔记或备份。';else $('saveState').textContent='笔记自动保存在当前浏览器';}
function turn(delta){if(page+delta<0||page+delta>=course[index].pages.length)return;page+=delta;suppressFollow=true;renderPage()}
function jumpPage(n){page=n;const t=course[index].pages[n].time;activeSegment=t;suppressFollow=true;seekMedia(audio,t);renderPage()}
$('directory').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)selectLesson(Number(b.dataset.lesson))};$('search').oninput=directory;
$('pages').onclick=e=>{const b=e.target.closest('[data-page]');if(b)jumpPage(Number(b.dataset.page))};$('pageSelect').onchange=e=>jumpPage(Number(e.target.value));
for(const id of ['prevPage','fullPrev'])$(id).onclick=()=>turn(-1);for(const id of ['nextPage','fullNext'])$(id).onclick=()=>turn(1);
$('prevLesson').onclick=()=>selectLesson(index-1);$('nextLesson').onclick=()=>selectLesson(index+1);
$('fullscreen').onclick=()=>{if($('stage').requestFullscreen)$('stage').requestFullscreen().catch(()=>toast('当前浏览器不支持全屏，请使用浏览器缩放查看。'));else toast('当前浏览器不支持全屏，请横屏查看课件。')};$('exitFull').onclick=()=>document.exitFullscreen?.();
$('speed').value=String(saved.speed);$('speed').onchange=e=>{saved.speed=Number(e.target.value);audio.playbackRate=saved.speed;longAudio.playbackRate=saved.speed;persist()};$('follow').checked=saved.follow;$('autoplay').checked=saved.autoplay;
$('follow').onchange=e=>{saved.follow=e.target.checked;suppressFollow=false;activeSegment=null;persist()};$('autoplay').onchange=e=>{saved.autoplay=e.target.checked;persist()};
audio.addEventListener('timeupdate',()=>{const t=audio.currentTime,c=course[index];const times=c.pages.map(p=>p.time).filter(v=>v<=t+.15);const active=times.length?Math.max(...times):0;if(saved.follow){if(active!==activeSegment){activeSegment=active;suppressFollow=false}if(!suppressFollow&&c.pages[page].time!==active){page=c.pages.findIndex(p=>p.time===active);if(page>=0)renderPage()}}if(Date.now()-lastSaved>2000){snapshot();lastSaved=Date.now()}});
audio.addEventListener('pause',snapshot);audio.addEventListener('ended',()=>{snapshot();if(saved.autoplay&&index<23)selectLesson(index+1,{start:true,play:true});else toast('本讲播放结束。完成练习后，可标记本讲完成。')});audio.addEventListener('play',()=>longAudio.pause());
audio.addEventListener('error',()=>toast('音频未能打开，请确认 HTML 与配套文件夹放在一起。'));longAudio.addEventListener('error',()=>toast('连续音频未能打开，请确认音频合集文件夹完整。'));$('slide').onerror=()=>toast('课件图片未能打开，请确认 assets 文件夹完整。');
$('note').oninput=()=>{record().note=$('note').value;persist();$('saveState').textContent=storeOK?'已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'请导出笔记，当前浏览器未允许保存'};
$('complete').onclick=()=>{record().done=!record().done;persist();$('complete').textContent=record().done?'已完成 · 点击取消':'标记本讲完成';directory();toast(record().done?'本讲已标记完成。':'已取消完成标记。')};
$('scriptTab').onclick=()=>setTab('script');$('notesTab').onclick=()=>setTab('notes');
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('exportNotes').onclick=()=>{snapshot();let text='# 企业精益转型的领导之道 · 我的学习笔记\n\n导出时间：'+new Date().toLocaleString('zh-CN')+'\n';for(const c of course){const r=saved.lessons[c.id]||{};text+=`\n## ${c.id} · ${c.chapter} · ${c.title}\n\n学习状态：${r.done?'已完成':'未完成'}\n\n${r.note||'（暂无笔记）'}\n`}download('我的精益课程学习笔记.md',text,'text/markdown;charset=utf-8');toast('已导出全部讲次的学习笔记。')};
$('backup').onclick=()=>{snapshot();download('精益课程学习记录备份.json',JSON.stringify({version:1,course:'lean-course-v1',saved},null,2),'application/json')};$('restore').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(v.course!=='lean-course-v1'||v.version!==1||!v.saved?.lessons)throw Error();const next={...saved,lessons:{...saved.lessons}};for(const c of course){const r=v.saved.lessons[c.id];if(r&&typeof r==='object')next.lessons[c.id]={page:Number.isInteger(r.page)?Math.max(0,Math.min(r.page,c.pages.length-1)):0,time:Number.isFinite(r.time)?Math.max(0,Math.min(r.time,c.duration)):0,note:typeof r.note==='string'?r.note:'',done:r.done===true};}audio.pause();saved=next;persist();audio.removeAttribute('src');selectLesson(index);toast('已恢复备份中的学习记录。')}catch(e){toast('无法读取备份，请选择本课程导出的 JSON 文件。')}finally{$('restoreFile').value=''}};
$('menu').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',open)};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||$('album').open)return;if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}if(e.key==='ArrowRight'){e.preventDefault();turn(1)}});
function showAlbum(){audio.pause();$('album').showModal();longAudio.playbackRate=Number(saved.speed)||1;if(!longAudio.dataset.ready){longAudio.load();longAudio.dataset.ready='1'}albumUpdate()}
$('openAlbum').onclick=showAlbum;$('closeAlbum').onclick=()=>$('album').close();$('album').addEventListener('close',()=>longAudio.pause());longAudio.addEventListener('play',()=>audio.pause());
$('albumTotal').textContent='按课程顺序连续收听 · 总时长 '+fmt(course.at(-1).end)+' · 倍速沿用学习页设置';
$('albumList').innerHTML=course.map((c,i)=>`<li data-album-row="${i}"><button data-album="${i}">${c.id} · ${esc(c.chapter)} · ${esc(c.title)}<small>${fmt(c.start)} 开始 · 本讲 ${fmt(c.duration)} · ${esc(c.unit)}</small></button><a href="${esc(c.audio)}" download>下载本讲</a></li>`).join('');
$('albumList').onclick=e=>{const b=e.target.closest('[data-album]');if(b)seekMedia(longAudio,course[Number(b.dataset.album)].start,true)};
function albumUpdate(){let n=course.findIndex(c=>longAudio.currentTime>=c.start&&longAudio.currentTime<c.end);if(n<0)n=23;const c=course[n];$('albumNow').textContent=`${c.id} · ${c.chapter} · ${c.title}`;if(n!==albumIndex){$('albumList').querySelectorAll('li').forEach((li,j)=>li.classList.toggle('active',j===n));albumIndex=n}}
longAudio.addEventListener('timeupdate',albumUpdate);window.addEventListener('pagehide',snapshot);
selectLesson(Number.isInteger(saved.last)?Math.max(0,Math.min(23,saved.last)):0);
</script></body></html>
