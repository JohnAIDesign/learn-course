<script id="course-data" type="application/json">[{"id": "L00", "title": "导学：从一个工作问题开始", "chapter": "全书导学", "source": "全书主线、第1章案例", "unit": "地图与学习方法", "status": "媒体、本地内容及PPT逐页检查完成，待听审", "pages": [{"n": 1, "title": "课程目标与学习成果", "text": "课程目标与学习成果\n理解全书的主要实践主题\n带着自己的问题学习\n最终形成一份改善行动草案\n导学与回顾 · L00    1/6    全课程学习", "notes": "第1页。课程目标与学习成果。欢迎学习企业精益转型的领导之道。本课程把全书整理成六个学习单元，加上导学和最后回顾，共二十四讲。请先选一个自己熟悉的工作问题，例如资料交接常常需要补充。随着课程推进，你会逐步说明问题、观察过程、思考指标，并写出需要谁支持的行动草案。这是整理者设计的学习路线。作者在第一章提醒，领导实践来自不断试验，学习需要长期积累。完成课程是实践的起点。\n来源（Obsidian库内路径）：\n00_项目规划/精益课程简化实施/课程学习地图.md\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S05 本章总结.md#^llet-ch01-s05-p001", "image": "assets/slides/L00/01.png", "time": 0}, {"n": 2, "title": "六单元学习地图", "text": "六单元学习地图\n理解精益，目标与度量\n流程与改善，团队与人才\n战略与推进，领导与文化\n导学与回顾 · L00    2/6    全课程学习", "notes": "第2页。六单元学习地图。六个单元共同回答一项改善需要考虑的问题。理解精益帮助认识价值与浪费，目标与度量帮助判断效果，流程与改善帮助观察工作怎样流动。团队与人才讨论谁参与以及怎样培养，战略与推进讨论方向和支持安排，领导与文化讨论日常行为怎样持续。六单元名称和相互关系是课程导航的教学整理，不能当作原书另立的管理模型。第一次建议按顺序学习，复习时可以按工作问题返回对应单元。\n来源（Obsidian库内路径）：\n00_项目规划/精益课程简化实施/课程学习地图.md", "image": "assets/slides/L00/02.png", "time": 54}, {"n": 3, "title": "原书案例：HON的持续学习", "text": "原书案例：HON的持续学习\n老师指导团队运用工具\n领导者管理长期变化\n目标节奏需要结合自身条件\n导学与回顾 · L00    3/6    全课程学习", "notes": "第3页。原书案例：HON的持续学习。第一章中，作者回忆在HON公司推动精益实践，外部老师定期指导团队运用工具，自己承担长期变化的管理工作。作者介绍了当时的改善目标，也明确不建议刚开始转型的公司照搬那样的节奏。学习这个案例时，可以关注工具学习、领导支持与持续实践的联系，不必复制案例的目标数字。这是作者的历史叙述，并不说明这些企业今天的状况，也不能保证其他团队取得相同结果。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S04 HON公司.md#^llet-ch01-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S04 HON公司.md#^llet-ch01-s04-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S05 本章总结.md#^llet-ch01-s05-p002", "image": "assets/slides/L00/03.png", "time": 108}, {"n": 4, "title": "学习入口与知识入口", "text": "学习入口与知识入口\n课程首页选择单元和讲次\n每讲入口打开PPT、音频和学习单\n需要查证时进入知识卡和原文\n导学与回顾 · L00    4/6    全课程学习", "notes": "第4页。学习入口与知识入口。课程首页提供六个单元的入口。进入一讲后，打开PPT并播放配套音频，听到页码提示时翻页，遇到练习可以暂停。第三章沿用已有课程媒体，请按该单元说明使用。遇到陌生概念，可以从单元页面进入知识卡，再查看原文。图谱用于了解关联，文件卡片可右键选择在新标签页中打开。学习路线解决先学什么，知识入口帮助查询概念与来源。请先练习找到一讲和它的原文入口。\n来源（Obsidian库内路径）：\n00_项目规划/精益课程简化实施/课程学习地图.md", "image": "assets/slides/L00/04.png", "time": 160}, {"n": 5, "title": "工作练习：我的起点", "text": "工作练习：我的起点\n最近一次具体问题是什么\n谁受到影响，有哪些已知事实\n我最想学会什么\n导学与回顾 · L00    5/6    全课程学习", "notes": "第5页。工作练习：我的起点。请打开导学与回顾工作学习单，写下最近发生的一次具体问题。以资料交接为例，可以写接收者发现资料缺项，需要返回询问。这个例子是整理者设计的情境，没有预设原因，也没有虚构改善效果。请填写发生在哪个过程、谁受到影响、现在有哪些事实，再写出你希望通过课程学会什么。暂时不知道的地方标明待观察即可。后续单元尽量沿用同一个问题，减少重复填写。\n来源（Obsidian库内路径）：\n00_项目规划/精益课程简化实施/课程学习地图.md", "image": "assets/slides/L00/05.png", "time": 214}, {"n": 6, "title": "导学小结与第一站", "text": "导学小结与第一站\n先选问题，再按单元学习\n保留学习单，随学习补充事实\n第一站：理解精益 L01\n导学与回顾 · L00    6/6    全课程学习", "notes": "第6页。导学小结与第一站。导学到这里结束。你已经知道课程的六个单元，也知道从课程入口查找PPT、音频、知识卡和原文。开始第一讲前，请检查自己能否完成两件事：说清一个工作问题，以及找到理解精益单元的第一讲。学习时不必一次记住所有工具名称，把与自己工作有关的概念写到学习单上，再用原文核对含义。现在返回课程首页，进入理解精益，从第一讲继续。\n来源（Obsidian库内路径）：\n00_项目规划/精益课程简化实施/课程学习地图.md\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S05 本章总结.md#^llet-ch01-s05-p001", "image": "assets/slides/L00/06.png", "time": 267}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L00_全书导学_导学：从一个工作问题开始.pptx", "audio": "音频合集/L00_全书导学_导学：从一个工作问题开始.mp3", "exercises": "# 导学与回顾：我的一页工作学习单\n\n整理者设计。导学时先填写起点；后续沿用各单元已有记录，回顾时再汇总，不必重复抄写。\n\n## L00：我的起点\n\n- 一次具体工作问题：____\n- 谁受到影响，影响是什么：____\n- 已知事实和待了解的内容：____\n- 我希望通过课程学会什么：____\n- 最先进入的课程和原文入口：____\n\n## L23：我的行动草案\n\n| 内容 | 我的记录 |\n|---|---|\n| 问题与客户或接收者影响 | |\n| 已知事实、记录日期及来源 | |\n| 观察指标、现状值及口径 | |\n| 实际过程与待核实原因 | |\n| 准备验证的一项行动 | |\n| 负责人、参与者与所需支持 | |\n| 与组织方向的联系 | |\n| 回看日期与记录方法 | |\n| 实施后的实际结果（未实施先留空） | |\n| 我或同事学会了什么 | |\n| 仍有的疑问及下一步 | |\n\n## 最后自测\n\n- 我能否向同事说明问题并区分事实与猜测？____\n- 我能否找到相关概念和原文？____\n- 下一步做什么、谁参与、何时回看？____\n\n返回单元与知识入口 · L00导学 · L23回顾\n", "duration": 315.6196825396825, "start": 0, "end": 315.6196825396825}, {"id": "L01", "title": "精益是什么，要解决什么问题", "chapter": "第01—02章", "source": "第1—2章", "unit": "理解精益", "status": "媒体与内容检查完成，待听审", "pages": [{"n": 1, "title": "从客户遇到的问题开始", "text": "从客户遇到的问题开始\n以人的参与推动改进\n适用于不同工作流程\n目标是持续解决客户问题\n理解精益 · L01    1/6    原书第1—2章及附录选读", "notes": "第1页。从客户遇到的问题开始。这一单元是全课程的起点。请先想一件你熟悉的工作：交付经常推迟，资料反复退回，或同样的错误不断出现。这里的情境是学习提示，不是书中的企业案例。作者在第二章把精益概括为以人员激励为本的改进系统，最终要建立持续解决客户问题的学习文化。学完本讲，你应能说明精益要改变什么，并选定一个后续课程持续观察的问题。先理解这个目的，再学习具体工具。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S06 本章总结.md#^llet-ch02-s06-p001", "image": "assets/slides/L01/01.png", "time": 0}, {"n": 2, "title": "持续改进与尊重人", "text": "持续改进与尊重人\n持续改进观念和实践\n创造愿意参与改善的条件\n教会工具，并在日常工作中运用\n理解精益 · L01    2/6    原书第1—2章及附录选读", "notes": "第2页。持续改进与尊重人。原书从一个角度提出两大支柱：观念与实践的持续改进，以及尊重人而产生的动力。作者对尊重人的解释很具体：组织需要设计让人想改进的系统，教会改良工具，并让大家每天运用。由此理解，改善需要人的参与，也需要组织提供学习条件。联系自己的工作，可以问一问：同事发现问题时，是否有机会说明事实、参与试验和获得指导？这是整理者设计的思考问题，用来把书中的原则落到日常经历。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S02 两大支柱.md#^llet-ch02-s02-p003-list\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S02 两大支柱.md#^llet-ch02-s02-p005", "image": "assets/slides/L01/02.png", "time": 51}, {"n": 3, "title": "从多个角度理解同一件事", "text": "从多个角度理解同一件事\n看见并减少浪费\n发现问题，追查根源\n学习质量与流程改善的方法\n理解精益 · L01    3/6    原书第1—2章及附录选读", "notes": "第3页。从多个角度理解同一件事。第二章没有只给一个定义。作者还从识别浪费、发现问题和解决根源等角度说明精益。他讨论质量与精益两类方法的结合，强调人员发展。这里要分清：持续改进与尊重人是一种原则描述；本章后面的全面质量管理与丰田生产系统，是另一种方法框架描述。课程不把两组名称混成一套清单。对初学者，先抓住共同目的：让工作更好地满足客户需要，同时让参与者学会发现和解决问题。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S04 一个问题识别和问题解决系统.md#^llet-ch02-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S05 六西格玛还是精益生产，或两者兼有？.md#^llet-ch02-s05-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S05 六西格玛还是精益生产，或两者兼有？.md#^llet-ch02-s05-p004", "image": "assets/slides/L01/03.png", "time": 106}, {"n": 4, "title": "原书案例：杰克制动的改变", "text": "原书案例：杰克制动的改变\n问题：交付与客户期望有差距\n做法：调整流程，持续学习与解决问题\n原书报告：交货时间从超过30天降至1天\n理解精益 · L01    4/6    原书第1—2章及附录选读", "notes": "第4页。原书案例：杰克制动的改变。第一章的杰克制动案例，把这些原则放在具体经历中。作者描述，企业的交付与客户期望存在差距。团队调整生产流程后，仍有设置、质量、物料等许多问题需要解决。随后两年多，老师到现场指导改善，团队反复学习、重新设计流程。原书报告交货时间从超过三十天压缩到一天，并形成不断解决问题的学习文化。这是作者叙述的历史结果，不是本课程对其他企业的承诺。学习重点是流程调整之后持续解决问题的过程。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S03 杰克制动（丹纳赫）（Jake Brake（Danaher））.md#^llet-ch01-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S03 杰克制动（丹纳赫）（Jake Brake（Danaher））.md#^llet-ch01-s03-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S03 杰克制动（丹纳赫）（Jake Brake（Danaher））.md#^llet-ch01-s03-p006", "image": "assets/slides/L01/04.png", "time": 161}, {"n": 5, "title": "把案例联系到自己的工作", "text": "把案例联系到自己的工作\n选一项具体交付\n写清接收者与期望\n记录实际差距，未知处留待观察\n理解精益 · L01    5/6    原书第1—2章及附录选读", "notes": "第5页。把案例联系到自己的工作。现在暂停音频，打开工作学习单。选一项你实际参与的交付，例如把完整资料交给下一个岗位。写清谁接收、对方需要什么，以及最近一次实际发生了什么。不要一开始就写同事态度不好或部门效率低，这些判断还不能代替过程事实。可以先写资料何时到、缺了什么、返还过几次；没有记录的地方就标为待观察。这是整理者练习，借用原书从客户问题出发、到现场了解工作的思路，不要求此时提出整改方案。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S06 本章总结.md#^llet-ch02-s06-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p007", "image": "assets/slides/L01/05.png", "time": 220}, {"n": 6, "title": "小结与下一讲", "text": "小结与下一讲\n三个要点：客户问题、人的参与、持续学习\n自测：一次流程调整为何还不够？\n行动：带着一个具体问题去观察\n理解精益 · L01    6/6    原书第1—2章及附录选读", "notes": "第6页。小结与下一讲。本讲记住三个要点：改善围绕客户的问题展开，人的参与需要学习条件，改变要靠持续发现和解决问题来延续。自测一下：为什么杰克制动调整设备和流程后，还需要老师指导和反复改善？可以从调整后仍暴露许多问题、团队需要继续学习来回答。你的下一步，是带着工作学习单上的一项交付去看实际过程。下一讲用浪费和根因解决的视角进一步观察；之后的目标与度量单元，再帮助你判断改善是否发生。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S03 杰克制动（丹纳赫）（Jake Brake（Danaher））.md#^llet-ch01-s03-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH01-S03 杰克制动（丹纳赫）（Jake Brake（Danaher））.md#^llet-ch01-s03-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S02 两大支柱.md#^llet-ch02-s02-p005", "image": "assets/slides/L01/06.png", "time": 277}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L01_第01—02章_精益是什么，要解决什么问题.pptx", "audio": "音频合集/L01_第01—02章_精益是什么，要解决什么问题.mp3", "exercises": "# 理解精益：我的工作学习单\n\n本表为整理者设计。复制一份后填写，两讲使用同一个问题，暂时不知道的内容写“待观察”。\n\n## L01：选定一个具体问题\n\n- 我负责或参与的交付：____\n- 谁接收，接收者期望什么：____\n- 最近一次实际情况与期望的差距：____\n- 我能直接观察什么，需要向谁了解：____\n\n## L02：补齐事实与判断方法\n\n| 需要说明的内容 | 我的记录 |\n|---|---|\n| 问题是什么？当前流程怎样运行？ | |\n| 怎样度量？什么结果表示问题得到解决？ | |\n| 上次如何处理？后来是否复发？ | |\n| 已经观察到的事实 | |\n| 可能的原因（尚待验证） | |\n| 下一步准备观察或核对的内容 | |\n\n## 小结：3—1—1\n\n- 我学到的三个要点：____／____／____\n- 自测：一次补发为什么可能只是临时控制？我的解释：____\n- 一个行动及回看时间：____\n\n返回本单元与知识地图 · L01 · L02\n", "duration": 331.1413151927438, "start": 315.6196825396825, "end": 646.7609977324263}, {"id": "L02", "title": "识别浪费与解决问题", "chapter": "第02章", "source": "第2章、附录A/G", "unit": "理解精益", "status": "媒体与内容检查完成，待听审", "pages": [{"n": 1, "title": "从忙碌中看见过程", "text": "从忙碌中看见过程\n七大浪费是观察的起点\n逐步记录实际工作\n到现场了解发生了什么\n理解精益 · L02    1/6    原书第1—2章及附录选读", "notes": "第1页。从忙碌中看见过程。上一讲已经选定一个具体工作问题。这一讲练习看见过程中的浪费，并区分暂时处理和根源解决。作者认为，七大浪费的价值在于帮助我们改变看工作的角度。仅凭一张分类表，并不能知道自己现场的问题。先记录一项工作经历哪些步骤、发生哪些交接，再看每一步怎样影响客户需要。这里的现场可以是车间，也可以是实际处理资料和交付服务的工作位置。练习的目标是形成一个可以继续查证的问题描述。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p004\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p005\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p007", "image": "assets/slides/L02/01.png", "time": 0}, {"n": 2, "title": "七大浪费：帮助自己观察", "text": "七大浪费：帮助自己观察\n生产过剩、产品缺陷、搬运或运输\n库存、过度加工\n等待时间、不必要的动作\n理解精益 · L02    2/6    原书第1—2章及附录选读", "notes": "第2页。七大浪费：帮助自己观察。原书列出七类：生产过剩、产品缺陷、搬运或运输、库存、过度加工、等待时间、不必要的动作。先不急着给每个步骤贴标签。以资料交付为学习情境，资料反复返还可以提示我们观察缺陷和返工，排队等待处理可以提示我们记录等待，重复录入则需要进一步了解它的用途。这些是整理者举的观察例子，不是原书企业的测量结果。同一步可能有不同解释，分类只是提出问题的起点，仍要查看真实过程及接收者的需要。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p003-list\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p004", "image": "assets/slides/L02/02.png", "time": 55}, {"n": 3, "title": "原书案例：诊所流程中的非增值活动", "text": "原书案例：诊所流程中的非增值活动\n从客户需要审视每个步骤\nThedaCare用流程图识别改进机会\n非增值步骤不能一律直接删除\n理解精益 · L02    3/6    原书第1—2章及附录选读", "notes": "第3页。原书案例：诊所流程中的非增值活动。原书用医院集团的诊所流程说明如何识别非增值活动，图二点一可从本讲的知识入口查看。作者建议思考：客户是否愿意为这一步付费，如果做两次，客户是否愿意支付两次费用。同时，他明确提醒，并非所有非增值步骤都能删除。因此本讲只用案例学习逐步观察，不从图中的底纹直接推断哪些步骤必须取消，也不编造减少了多少时间。回到自己的工作，先写下一项值得追问的步骤，再了解它为什么存在。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S03 识别和消除浪费.md#^llet-ch02-s03-p006", "image": "assets/slides/L02/03.png", "time": 112}, {"n": 4, "title": "暂时控制与根因解决", "text": "暂时控制与根因解决\n先控制问题造成的影响\n追问原因，避免预设答案\n用事先定义的指标评估结果\n理解精益 · L02    4/6    原书第1—2章及附录选读", "notes": "第4页。暂时控制与根因解决。第二章强调，表面问题处理后反复出现，说明还需要在根源层面解决。附录中的企业案例提供了进一步的理解：临时控制是为了防止问题继续影响公司和客户，要保持到团队能证明根源已排除；寻找根因需要训练和指导，不能一开始就带着预设答案。本页摘取附录八步方法中的几个环节帮助理解，不是用三个要点替代完整方法。附录A的五个为什么也可作为追问的工具；整理者提醒，连续追问之后仍要核实事实和评估结果，不能只凭问了五遍宣布问题解决。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S04 一个问题识别和问题解决系统.md#^llet-ch02-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/APG-S09 第三步：实施控制行动.md#^llet-apG-s09-p001\n10_书籍/企业精益转型的领导之道/01_章节/APG-S10 第四步：确定根本原因.md#^llet-apG-s10-p003\n10_书籍/企业精益转型的领导之道/01_章节/APG-S12 第六步：评估结果.md#^llet-apG-s12-p001\n10_书籍/企业精益转型的领导之道/01_章节/APA-S07 五个为什么.md#^llet-apA-s07-p001", "image": "assets/slides/L02/04.png", "time": 170}, {"n": 5, "title": "工作练习：把问题说清楚", "text": "工作练习：把问题说清楚\n问题是什么，当前状态如何\n怎样度量，怎样算解决\n分开记录事实、猜测和待核内容\n理解精益 · L02    5/6    原书第1—2章及附录选读", "notes": "第5页。工作练习：把问题说清楚。请暂停音频，继续使用上一讲的工作问题。附录G描述问题时提出四个问题：问题是什么，我们怎么度量，怎样定义问题解决，以及当前流程或产品处于什么状态。用这四个问题补齐学习单。再写上上次采取了什么处理，后来是否复发。原因还不清楚时，写成待验证的猜测，并列出下一步准备观察什么。把事实和猜测分开记录，是本课的练习安排。此时不需要复杂报表，能让另一个人看懂问题与判断依据，就可以继续学习。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/APG-S08 第二步：描述问题.md#^llet-apG-s08-p001\n10_书籍/企业精益转型的领导之道/01_章节/APG-S08 第二步：描述问题.md#^llet-apG-s08-p002-list\n10_书籍/企业精益转型的领导之道/01_章节/APG-S08 第二步：描述问题.md#^llet-apG-s08-p003\n10_书籍/企业精益转型的领导之道/01_章节/APG-S10 第四步：确定根本原因.md#^llet-apG-s10-p003", "image": "assets/slides/L02/05.png", "time": 230}, {"n": 6, "title": "单元小结与下一步", "text": "单元小结与下一步\n三个要点：看过程、问原因、验结果\n自测：补发一次资料等于解决根因吗？\n行动：记录一次实际交付与复发情况\n理解精益 · L02    6/6    原书第1—2章及附录选读", "notes": "第6页。单元小结与下一步。理解精益这个单元，到这里先收在三个动作上：看实际过程，追问问题原因，用结果检查改善。自测一下，资料漏发后立刻补发，是否就证明根因解决？补发可能先控制了影响，是否解决根因，还要看漏发原因有没有查明，以及后续结果是否支持判断。这个例子是教学练习。下一步，请记录一次真实交付，保留现状与后续观察，不急着承诺改善幅度。接着进入目标与度量单元，用更清楚的指标来描述问题和检查变化。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/APG-S09 第三步：实施控制行动.md#^llet-apG-s09-p001\n10_书籍/企业精益转型的领导之道/01_章节/APG-S12 第六步：评估结果.md#^llet-apG-s12-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH02-S04 一个问题识别和问题解决系统.md#^llet-ch02-s04-p001", "image": "assets/slides/L02/06.png", "time": 290}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L02_第02章_识别浪费与解决问题.pptx", "audio": "音频合集/L02_第02章_识别浪费与解决问题.mp3", "exercises": "# 理解精益：我的工作学习单\n\n本表为整理者设计。复制一份后填写，两讲使用同一个问题，暂时不知道的内容写“待观察”。\n\n## L01：选定一个具体问题\n\n- 我负责或参与的交付：____\n- 谁接收，接收者期望什么：____\n- 最近一次实际情况与期望的差距：____\n- 我能直接观察什么，需要向谁了解：____\n\n## L02：补齐事实与判断方法\n\n| 需要说明的内容 | 我的记录 |\n|---|---|\n| 问题是什么？当前流程怎样运行？ | |\n| 怎样度量？什么结果表示问题得到解决？ | |\n| 上次如何处理？后来是否复发？ | |\n| 已经观察到的事实 | |\n| 可能的原因（尚待验证） | |\n| 下一步准备观察或核对的内容 | |\n\n## 小结：3—1—1\n\n- 我学到的三个要点：____／____／____\n- 自测：一次补发为什么可能只是临时控制？我的解释：____\n- 一个行动及回看时间：____\n\n返回本单元与知识地图 · L01 · L02\n", "duration": 347.1249886621315, "start": 646.7609977324263, "end": 993.8859863945578}, {"id": "L03", "title": "了解财务指标：个人的例子", "chapter": "第03章", "source": "第3章，复用M03-01", "unit": "目标与度量", "status": "使用版验收通过（含重点抽听）", "pages": [{"n": 1, "title": "了解财务指标：个人的例子", "text": "了解财务指标：个人的例子\n《企业精益转型的领导之道》第3章学习讲解\n本讲要点\n本章回答：企业到底该度量什么\n作者当年：指标虽多，却不知行动会负面影响哪些指标\n从一个个人财务模型的例子出发\nLLET-CH03-S01-v01", "notes": "开场讲作者在罗克韦尔的经历：追踪一百多种指标，却因不知行动会负面影响哪些指标而没有真正提高。这是作者当年处境，不作绝对结论。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S00 章首导语.md#^llet-ch03-s00-p001", "image": "assets/slides/L03/01.png", "time": 0.0, "segment": 1}, {"n": 2, "title": "一百种指标带来的困境", "text": "一百种指标带来的困境\n追踪至少一百种重点决策\n不知采取行动会负面影响哪些指标\n既没退步，也没真正提高", "notes": "强调这是作者当年的困境，不泛化成“指标多等于没度量”的绝对口号。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S00 章首导语.md#^llet-ch03-s00-p001", "image": "assets/slides/L03/02.png", "time": 0.0, "segment": 1}, {"n": 3, "title": "迪尔公司的资金流模型", "text": "迪尔公司的资金流模型\n任务：建立资金流预测模型\n丰田式指导：靠追问理解问题\n大野耐一的“五个为什么”", "notes": "介绍吉恩·斯科特纳斯交付任务的背景，点出“追问而非直接教学”的指导方式。\n对应片段：02\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S01 了解财务指标：个人的例子.md#^llet-ch03-s01-p001", "image": "assets/slides/L03/03.png", "time": 35.215, "segment": 2}, {"n": 4, "title": "五个为什么因素链", "text": "五个为什么因素链\n为什么⑤\n天气\n为什么④\n农作物产量\n为什么③\n农民净收入\n为什么②\n销售\n为什么①\n库存与应收\n第五问之后：无法预测全球气候\n示范：财务数字追溯到经营与外部因素", "notes": "逐层讲解因素链，第五问“太阳黑子”属原书自嘲式叙述，不是结论。\n对应片段：02\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益 ": 3, "title": "零缺陷与两位数改善", "text": "零缺陷与两位数改善\n质量真北：零缺陷（每件事、每天、每个国家）\n年度目标：每项改善 10%~30%（原书描述）\n四个维度必须同时提高", "notes": "读出“百分之十到百分之三十”。强调只抓一项会抵消整体改进；数字是原书描述，非实践保证。\n对应片段：02\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p002", "image": "assets/slides/L04/03.png", "time": 43.248, "segment": 2}, {"n": 4, "title": "大企业病与百分之百增值时间", "text": "大企业病与百分之百增值时间\n大企业病：傲慢 → 自满 → 失败\n交付周期真北：100% 增值时间（长期方向）\n原书描述典型流程 95%~99% 是非增值", "notes": "读出“百分之九十五到百分之九十九”。Aisin Seiki 案例是原书采访所述，不作“普遍可持续六十年”的保证。\n对应片段：03\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p003\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p004\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p005", "image": "assets/slides/L04/04.png", "time": 92.023, "segment": 3}, {"n": 5, "title": "人才培育：先造人后造物", "text": "人才培育：先造人后造物\n人才培育支撑前三项指标\n不只提高表现，还要改进工作\n在造物之前先造人", "notes": "强调精益度量必须四项齐全，不能只看经营结果。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p006\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p007", "image": "assets/slides/L04/05.png", "time": 147.572, "segment": 4}, {"n": 6, "title": "应用练习", "text": "应用练习\n对照四个真北指标，列出你们在度量什么\n哪些有年度目标，哪些没有\n是否只偏重其中一两项", "notes": "说明这是整理者设计的练习，请学员填写，不预设答案。\n对应片段：05\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S02 丰田的真北指标.md#^llet-ch03-s02-p002", "image": "assets/slides/L04/06.png", "time": 184.302, "segment": 5}], "timingNote": "按音频片段定位；部分页面共用同一片段，可手动翻页。", "ppt": "课件/L04_第03章_丰田的真北指标.pptx", "audio": "音频合集/L04_第03章_丰田的真北指标.mp3", "exercises": "\n# 我的工作学习单：目标与度量\n\n复制本页填写即可。本练习是整理者设计，不是原书内容，不要求写长篇心得。\n\n## 先描述问题\n\n- 我的工作场景：____\n- 最近发生的一个具体问题：____\n- 已经知道的事实（不知道的写“待观察”）：____\n\n## 选择一个概念并联系工作\n\n- 本章哪个概念帮助我理解问题：____\n- 原书案例与我的工作相似在哪里：____\n- 条件有哪些不同，不能直接照搬什么：____\n\n## 先观察，再讨论改进\n\n| 项目 | 我的填写 |\n|---|---|\n| 指标名称与含义 | |\n| 单位、分子/分母（适用时） | |\n| 从哪里开始计时/计数，到哪里结束 | |\n| 观察哪类工作、哪个时间范围 03-S05 质量改进.md#^llet-ch03-s05-p002\n图表出处：10_书籍/企业精益转型的领导之道/03_图表/图3.6.md", "image": "assets/slides/L06/03.png", "time": 22.915, "segment": 2}, {"n": 4, "title": "投诉的冰山一角", "text": "投诉的冰山一角\n90% 失望顾客默默离开\n85% 向至少9人抱怨，15% 向至少20人抱怨\n原书举例：一个投诉可能已存在10个质量问题、130个潜在客户被警告", "notes": "读出“百分之九十”“百分之八十五”“百分之十五”。点出“金块”比喻；说明这条引用对应参考文献[2]，原书标注为来源不详（Source unknown）。\n对应片段：03\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S05 质量改进.md#^llet-ch03-s05-p003", "image": "assets/slides/L06/04.png", "time": 75.888, "segment": 3}, {"n": 5, "title": "回头客成本只有六分之一", "text": "回头客成本只有六分之一\n回头客成本＝新客户成本的 1/6（原书引用）\n质量为成本最低的推广（作者观点）\n持续质量改进＝增长策略", "notes": "读出“六分之一”。强调这些是原书引用和作者观点，非已验证普适规律；谈增长策略先考虑精益。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S05 质量改进.md#^llet-ch03-s05-p004\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S05 质量改进.md#^llet-ch03-s05-p005", "image": "assets/slides/L06/05.png", "time": 121.60400000000001, "segment": 4}, {"n": 6, "title": "应用练习", "text": "应用练习\n列出三个质量指标及口径、数值\n收集客户对质量的反馈\n记录本企业证据，不套图预测ROI、不猜落点", "notes": "说明这是整理者设计的练习，请学员填写；明确图3.6分档与样本限制，勿推测本企业落点。\n对应片段：05\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S05 质量改进.md#^llet-ch03-s05-p002\n图表出处：10_书籍/企业精益转型的领导之道/03_图表/图3.6.md", "image": "assets/slides/L06/06.png", "time": 152.193, "segment": 5}], "timingNote": "按音频片段定位；部分页面共用同一片段，可手动翻页。", "ppt": "课件/L06_第03章_质量改进.pptx", "audio": "音频合集/L06_第03章_质量改进.mp3", "exercises": "\n# 我的工作学习单：目标与度量\n\n复制本页填写即可。本练习是整理者设计，不是原书内容，不要求写长篇心得。\n\n## 先描述问题\n\n- 我的工作场景：____\n- 最近发生的一个具体问题：____\n- 已经知道的事实（不知道的写“待观察”）：____\n\n## 选择一个概念并联系工作\n\n- 本章哪个概念帮助我理解问题：____\n- 原书案例与我的工作相似在哪里：____\n- 条件有哪些不同，不能直接照搬什么：____\n\n## 先观察，再讨论改进\n\n| 项目 | 我的填写 |\n|---|---|\n| 指标名称与含义 | |\n| 单位、分子/分母（适用时） | |\n| 从哪里开始计时/计数，到哪里结束 | |\n| 观察哪类工作、哪个时间范围 | |\n| 当前值和数据来源；没有数据写待观察 | |\n| 还要关注哪个方向，避免只改善一项 | |\n| 一次小范围观察或尝试 | |\n| 参与人及复盘时间 | |\n\n## 学完自测\n\n不看PPT，用自己的话回答：只看财务结果为什么不足以确定下一步改进动作？我的例子里还缺什么事实？\n\n返回本单元 · 填写贯穿全课程的工作学习单\n", "duration": 188.88707482993198, "start": 1641.1313378684808, "end": 1830.0184126984127}, {"id": "L07", "title": "交付时间与流程改进", "chapter": "第03章", "source": "第3章，复用M03-06", "unit": "目标与度量", "status": "使用版验收通过（含重点抽听）", "pages": [{"n": 1, "title": "交付时间与", "text": "交付时间与\n流程改进\n《企业精益转型的领导之道》第3章学习讲解\n客户等待、流程设计与案例数字的正确读法\nLLET-CH03-S06-v01", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n对应教学稿片段01。学习目标：理解客户响应能力、图3.7和Watlow案例，并区分不同指标。材料属于学习解释，不替代原文。", "image": "assets/slides/L07/01.png", "time": 0.0, "segment": 1}, {"n": 2, "title": "客户等待与响应能力", "text": "客户等待与响应能力\n原书第24–25、27页；操作性定义为整理者解释\n同一笔客户需求，经过一整条业务流程\n交付时间的记录需要明确起点与终点\n收到报价请求，直到发出完整报价\n收到正式订单，直到客户收到产品\n不同起止点形成不同指标，比较前先统一口径", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n证据段落：llet-ch03-s06-p001、p010。对应音频片段01。作者将降低库存与客户响应价值相联系。起止点例子是整理者解释，不是原书定义。", "image": "assets/slides/L07/02.png", "time": 0.0, "segment": 1}, {"n": 3, "title": "图3.7：交付时间与增长案例", "text": "图3.7：交付时间与增长案例\n原扫描图3.7，PDF第45页；上下文中的历史案例", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n证据：llet-ch03-s06-p002；图3.7逐项视觉核验。图题2–4倍与首行5倍不同，原样保留。图片来源：原PDF第45页300DPI裁切，坐标见图3.7裁切记录.json。对应片段02。", "image": "assets/slides/L07/03.png", "time": 75.43, "segment": 2}, {"n": 4, "title": "三个案例的原表数据", "text": "三个案例的原表数据\n原书图3.7；“平均增长”的基期和公式未在表中单列\n公司\n业务\n交付时间减少\n平均增长\nAtlas门业\n工业门\n66%\n5倍\n拉尔夫·威尔逊塑料\n装饰层压板\n75%\n4倍\n托马斯维尔\n家具\n70%\n2倍\n图注列出的适用过程\n产品开发、应用工程、订单输入、纠正措施", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n证据：llet-ch03-s06-p002与图3.7。对应片段02。保留原表四列与三行，不把5倍转换成增长500%。图题2–4倍与表格5倍不一致的范围保留。此页为依据原图整理的可编辑数据表。", "image": "assets/slides/L07/04.png", "time": 75.43, "segment": 2}, {"n": 5, "title": "Watlow：报价、图样与样件", "text": "Watlow：报价、图样与样件\n原书第25–26页；约一月到约一周为案例粗略表述\n过程\n改善前\n改善后\n报价回应\n约1个月\n约1周\n工程图样\n约1个月\n约1周\n样件制造\n约1个月\n约1周\n书中报告的业务增长率：3% 提升到超过 15%\n此前“胜率约15%”是另一个指标，不能混用", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n证据段落：llet-ch03-s06-p004、p005、p006。对应片段03。改善前每阶段约一个月，改善后约一周。原书“三遍研究、剩余50%、减少75%”有计算表述疑点，本表不重构算法。胜率15%左右与业务增长率3%到超过15%是不同指标。历史结果未外部独立审计。", "image": "assets/slides/L07/05.png", "time": 161.92000000000002, "segment": 3}, {"n": 6, "title": "流程改变的多个结果", "text": "流程改变的多个结果\n原书第25–27页；以下均为作者报告的历史案例\nHON\n有机增长率约4%提高到超过12%\n行业排名由第五上升到第二\nThedaCare\n错误约减少80%，等待和住宿成本各约减少30%\n处理能力约提高30%\n皇家海军\n作者用“免费的航母”类比流程改善的能力价值\n这一说法不代表实际新增了一艘航母", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n证据段落：llet-ch03-s06-p003、p007、p008、p009、p010。对应片段04。HON有机增长率约4%到超过12%。ThedaCare错误约-80%，等待与住宿成本各约-30%，处理能力约+30%。皇家海军“免费的航母”是能力价值类比，不是实际新增军舰。不可将这些不同指标相加或推出普适因果。", "image": "assets/slides/L07/06.png", "time": 258.37, "segment": 4}, {"n": 7, "title": "案例数字的使用边界", "text": "案例数字的使用边界\n原书第25–26页；疑点按原文保留，不用于企业增长预测\n倍数、百分比、百分点\n先核对比较对象、基期与单位，再解释数字\n原书“增加6%～12%”的措辞存在歧义\n本模块保留说明，不转换为确定的增长公式\n交付时间和增长同时变化，不足以排除其他经营因素", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n证据段落：llet-ch03-s06-p002、p003、p005。对应音频02、03。原书“行业3%、增加6%～12%”有歧义。不能改为百分点。三次各减半数学上为87.5%，但原书同时写减少75%，不据此改写原书。教学仅使用清楚的时间对照和已核图表数据。", "image": "assets/slides/L07/07.png", "time": 75.43, "segment": 2}, {"n": 8, "title": "一条实际流程的观察练习", "text": "一条实际流程的观察练习\n整理者练习；需使用企业真实记录，不预设改善结果\n示例：客户询价至发出完整报价\n01  写清开始与结束的事件\n02  记录实际处理、交接和等待\n03  改进一个步骤，观察时间、差错与客户反馈\n复习：胜率与业务增长率为什么不能混用？\n客户等待为什么不能只用单个岗位的速度衡量？", "notes": "来源：《企业精益转型的领导之道》原PDF第44–47页，书内第24–27页。\n对应音频片段05，原理依据llet-ch03-s06-p001、p005、p009、p010。以下练习是整理者建议，不是海顺现状或原书案例。选询价到报价等流程，记录起止事件、等待与处理步骤，观察时间和差错。复习：胜率与增长率定义不同；客户经历完整流程而不是单岗位速度。", "image": "assets/slides/L07/08.png", "time": 348.15, "segment": 5}], "timingNote": "按音频片段定位；部分页面共用同一片段，可手动翻页。第7页是片段2、3共用的案例边界补充页，手动查看。", "ppt": "课件/L07_第03章_交付时间与流程改进.pptx", "audio": "音频合集/L07_第03章_交付时间与流程改进.mp3", "exercises": "\n# 我的工作学习单：目标与度量\n\n复制本页填写即可。本练习是整理者设计，不是原书内容，不要求写长篇心得。\n\n## 先描述问题\n\n- 我的工作场景：____\n- 最近发生的一个具体问题：____\n- 已经知道的事实（不知道的写“待观察”）：____\n\n## 选择一个概念并联系工作\n\n- 本章哪个概念帮助我理解问题：____\n- 原书案例与我的工作相似在哪里：____\n- 条件有哪些不同，不能直接照搬什么：____\n\n## 先观察，再讨论改进\n\n| 项目 | 我的填写 |\n|---|---|\n| 指标名称与含义 | |\n| 单位、分子/分母（适用时） | |\n| 从哪里开始计时/计数，到哪里结束 | |\n| 观察哪类工作、哪个时间范围 | |\n| 当前值和数据来源；没有数据写待观察 | |\n| 还要关注哪个方向，避免只改善一项 | |\n| 一次小范围观察或尝试 | |\n| 参与人及复盘时间 | |\n\n## 学完自测\n\n不看PPT，用自己的话回答：只看财务结果为什么不足以确定下一步改进动作？我的例子里还缺什么事实？\n\n返回本单元 · 填写贯穿全课程的工作学习单\n", "duration": 446.17850340136056, "start": 1830.0184126984127, "end": 2276.1969160997733}, {"id": "L08", "title": "成本与生产率改进", "chapter": "第03章", "source": "第3章，复用M03-07", "unit": "目标与度量", "status": "使用版验收通过（含重点抽听）", "pages": [{"n": 1, "title": "成本与生产率改进", "text": "成本与生产率改进\n《企业精益转型的领导之道》第3章学习讲解\n本讲要点\n成本的两大类：外部采购与人员\n生产率是内部成本主要驱动力（作者说法）\n生产率如何度量\nLLET-CH03-S07-v01", "notes": "开场点明本讲进入成本与生产率这一真北指标。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p001", "image": "assets/slides/L08/01.png", "time": 0.0, "segment": 1}, {"n": 2, "title": "两类成本合计占90%", "text": "两类成本合计占90%\n外部采购 ＋ 人员成本 = 90%（作者说法）\n外部采购是单一最大部分\n但很难从这里创造竞争优势", "notes": "读出“百分之九十”。强调是两类合计、作者说法，不是所有企业恒定结构，也不是外部采购独占。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p001", "image": "assets/slides/L08/02.png", "time": 0.0, "segment": 1}, {"n": 3, "title": "外部采购难创优势", "text": "外部采购难创优势\n大宗采购受全球价格影响\n特定组件由同行的行业专家生产\n丰田靠持股绑定供应商，海外难复制", "notes": "点出 CEO 需要二十年积累的经验法则；说明成功也惠及竞争对手。\n对应片段：02\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p002", "image": "assets/slides/L08/03.png", "time": 33.879, "segment": 2}, {"n": 4, "title": "人员与生产率驱动", "text": "人员与生产率驱动\n罗克韦尔汽车崩溃后成本减半的教训\n能否增长却不增员\n生产率决定内部成本90%以上（作者说法）", "notes": "强调“不靠裁员承诺”：原书来自被迫减员教训，提出“增长不增员”思路；“90%以上”是作者说法，非恒定结构。\n对应片段：03\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p003\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p004\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p005", "image": "assets/slides/L08/04.png", "time": 83.738, "segment": 3}, {"n": 5, "title": "生产率：输出除以输入", "text": "生产率：输出除以输入\n输出＝价值（制动器／病人／起降频率）\n输入＝工时；杰克制动：每个制动器所需时间\n霍恩公司：每个成员每小时多少美元", "notes": "说明维持单位价格让价格涨跌不干扰度量；强调要投入精力改进生产率，30%与70%口径有疑点，不作确定公式。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p007\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p008\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p010-list\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p011", "image": "assets/slides/L08/05.png", "time": 134.37, "segment": 4}, {"n": 6, "title": "应用练习", "text": "应用练习\n写下你们的输出单位与输入口径\n记录实际精力放在质量／交付／人才／生产率的分配\n写清每个指标的口径", "notes": "说明这是整理者设计的练习，请学员填写，不预设答案，不引用具体企业数据。\n对应片段：05\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S07 成本与生产率改进.md#^llet-ch03-s07-p010", "image": "assets/slides/L08/06.png", "time": 201.18900000000002, "segment": 5}], "timingNote": "按音频片段定位；部分页面共用同一片段，可手动翻页。", "ppt": "课件/L08_第03章_成本与生产率改进.pptx", "audio": "音频合集/L08_第03章_成本与生产率改进.mp3", "exercises": "\n# 我的工作学习单：目标与度量\n\n复制本页填写即可。本练习是整理者设计，不是原书内容，不要求写长篇心得。\n\n## 先描述问题\n\n- 我的工作场景：____\n- 最近发生的一个具体问题：____\n- 已经知道的事实（不知道的写“待观察”）：____\n\n## 选择一个概念并联系工作\n\n- 本章哪个概念帮助我理解问题：____\n- 原书案例与我的工作相似在哪里：____\n- 条件有哪些不同，不能直接照搬什么：____\n\n## 先观察，再讨论改进\n\n| 项目 | 我的填写 |\n|---|---|\n| 指标名称与含义 | |\n| 单位、分子/分母（适用时） | |\n| 从哪里开始计时/计数，到哪里结束 | |\n| 观察哪类工作、哪个时间范围 | |\n| 当前值和数据来源；没有数据写待观察 | |\n| 还要关注哪个方向，避免只改善一项 | |\n| 一次小范围观察或尝试 | |\n| 参与人及复盘时间 | |\n\n## 学完自测\n\n不看PPT，用自己的话回答：只看财务结果为什么不足以确定下一步改进动作？我的例子里还缺什么事实？\n\n返回本单元 · 填写贯穿全课程的工作学习单\n", "duration": 228.0839455782313, "start": 2276.1969160997733, "end": 2504.2808616780044}, {"id": "L09", "title": "人才培育", "chapter": "第03章", "source": "第3章，复用M03-08", "unit": "目标与度量", "status": "使用版验收通过（含重点抽听）", "pages": [{"n": 1, "title": "人才培育", "text": "人才培育\n《企业精益转型的领导之道》第3章学习讲解\n本讲要点\n先造人后造物\n“自主研”一周改善活动\n参与度指标：广度与深度\nLLET-CH03-S08-v01", "notes": "开场点明人才培育是四个真北指标中“人”的一项。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p001", "image": "assets/slides/L09/01.png", "time": 0.0, "segment": 1}, {"n": 2, "title": "先造人后造物", "text": "先造人后造物\n硬性东西容易建立，软性东西难以培养\n持续改善文化是重大工作\n生产汽车之前先培养人", "notes": "强调人才培育是所有真北指标背后的支撑。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p001", "image": "assets/slides/L09/02.png", "time": 0.0, "segment": 1}, {"n": 3, "title": "“自主研”一周改善活动", "text": "“自主研”一周改善活动\n6~8 人全职团队，为期一周\n集中改善价值流的一个基本部分\n期望实现：财务业绩、学习机会、文化转变（原书期望，非每次必有效）", "notes": "说明“自主研”是作者认为最有效、甚至唯一的办法；三件事是原书期望目标，非每次必有效。\n对应片段：03\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p003", "image": "assets/slides/L09/03.png", "time": 41.967, "segment": 3}, {"n": 4, "title": "领导亲眼看到浪费", "text": "领导亲眼看到浪费\n深入过程，识别增值与非增值\n原书描述 95% 操作由非增值（浪费）组成\n亲身体验是领导推动改进的主要动力", "notes": "读出“百分之九十五”。强调这是原书描述，不是你企业的测量结果；“讨论精益”与“亲眼看浪费”是两回事。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p004", "image": "assets/slides/L09/04.png", "time": 82.691, "segment": 4}, {"n": 5, "title": "丰田北美反省与参与指标", "text": "丰田北美反省与参与指标\n丰田北美反省后重新聚焦“自主研”\n广度：尽快让更多人参与两项活动\n深度：参与超过100次（原书经验，不保证能力/认同）", "notes": "说明参与度是转型期人才发展的重要指标；参与次数与学习效果需区分，这是原书报告的经验。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p005\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p006", "image": "assets/slides/L09/05.png", "time": 82.691, "segment": 4}, {"n": 6, "title": "应用练习", "text": "应用练习\n过去一年多少人参与跨职能改善活动\n谁已开始主动带领识别浪费\n评估组织的参与广度与深度", "notes": "说明这是整理者设计的练习，请学员填写，不预设答案。\n对应片段：05\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S08 人才培育.md#^llet-ch03-s08-p006", "image": "assets/slides/L09/06.png", "time": 146.542, "segment": 5}], "timingNote": "按音频片段定位；部分页面共用同一片段，可手动翻页。", "ppt": "课件/L09_第03章_人才培育.pptx", "audio": "音频合集/L09_第03章_人才培育.mp3", "exercises": "\n# 我的工作学习单：目标与度量\n\n复制本页填写即可。本练习是整理者设计，不是原书内容，不要求写长篇心得。\n\n## 先描述问题\n\n- 我的工作场景：____\n- 最近发生的一个具体问题：____\n- 已经知道的事实（不知道的写“待观察”）：____\n\n## 选择一个概念并联系工作\n\n- 本章哪个概念帮助我理解问题：____\n- 原书案例与我的工作相似在哪里：____\n- 条件有哪些不同，不能直接照搬什么：____\n\n## 先观察，再讨论改进\n\n| 项目 | 我的填写 |\n|---|---|\n| 指标名称与含义 | |\n| 单位、分子/分母（适用时） | |\n| 从哪里开始计时/计数，到哪里结束 | |\n| 观察哪类工作、哪个时间范围 | |\n| 当前值和数据来源；没有数据写待观察 | |\n| 还要关注哪个方向，避免只改善一项 | |\n| 一次小范围观察或尝试 | |\n| 参与人及复盘时间 | |\n\n## 学完自测\n\n不看PPT，用自己的话回答：只看财务结果为什么不足以确定下一步改进动作？我的例子里还缺什么事实？\n\n返回本单元 · 填写贯穿全课程的工作学习单\n", "duration": 168.82802721088436, "start": 2504.2808616780044, "end": 2673.108888888889}, {"id": "L10", "title": "将真北指标与财务指标相关联", "chapter": "第03章", "source": "第3章，复用M03-09", "unit": "目标与度量", "status": "使用版验收通过（含重点抽听）", "pages": [{"n": 1, "title": "将真北指标与财务指标相关联", "text": "将真北指标与财务指标相关联\n《企业精益转型的领导之道》第3章学习讲解\n本讲要点\n真北指标 → 财务指标\n同步改善的协同效应\n腾出能力用于增长\nLLET-CH03-S09-v01", "notes": "开场点明本讲是全章收官，把经营指标落到财务。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p001", "image": "assets/slides/L10/01.png", "time": 0.0, "segment": 1}, {"n": 2, "title": "利润表：四个项目", "text": "利润表：四个项目\n利润表项目\n与真北指标的关联\n销售\n质量改进、交付时间改进、新产品研发改进\n销售成本\n主要由生产率决定（原书论述）\nSGA 成本\n巨大花费是人的成本（原书缩写，不展开全称）\n财务成本\n债务下降或证券上升，向好的方向发展", "notes": "读出“SGA”，不展开英文全称；说明生产率翻倍使成本减半是原书论述，可能需几年。\n对应片段：01\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p001-list", "image": "assets/slides/L10/02.png", "time": 0.0, "segment": 1}, {"n": 3, "title": "资产负债表：三个影响", "text": "资产负债表：三个影响\n资产负债表项目\n与真北指标的关联\n营运资金\n库存周转率提高 → 所需营运资金降低\n固定资本\n资本密集度降至行业一半或四分之一（原书论述）\n债务\n6.9分净边际收益（单位不推断）", "notes": "读出“六点九分”，说明原书未说明单位，课程不推算；资本密集度是原书论述，不对企业许诺。\n对应片段：02\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p002-list", "image": "assets/slides/L10/03.png", "time": 48.099, "segment": 2}, {"n": 4, "title": "图3.8 壁炉事务所七年精益", "text": "图3.8 壁炉事务所七年精益\n指标\n七年精益后的结果\n事故率\n−81%\n保修成本\n−69%\n交货时间\n6周 → 5天\n完整性和及时性\n84% → 98%\n企业生产率\n+38%\n存货周转率\n+171%\n销售/平方英尺\n+131%\n营业收入百分比\n+221%\n资产报酬率\n+237%\n现金流\n+519%\nHD、Q、D 和 C 驱动所有财务指标", "notes": "读出“营业收入百分比这一项标注正百分之二百二十一”，按图面原项目名完整保留，不作百分点/收入金额推断；斯坦·阿斯克伦的任职在正文、是原书时点。\n对应片段：03\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p003\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p004\n图表出处：10_书籍/企业精益转型的领导之道/03_图表/图3.8.md", "image": "assets/slides/L10/04.png", "time": 97.211, "segment": 3}, {"n": 5, "title": "协同效应与增长时机", "text": "协同效应与增长时机\n四个真北指标要同步推进\n成长阶段是精益转型最好时机（原书论述）\n真北指标记作 Q、D、C/P、HD、G", "notes": "说明“G”原书未展开，课程按原样保留；协同效应带来ROI成倍增长；“最好时机”是原书论述，不对企业许诺。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p005\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p006", "image": "assets/slides/L10/05.png", "time": 171.555, "segment": 4}, {"n": 6, "title": "本章总结", "text": "本章总结\n生产率提高 4 倍\n质量问题减少 99%\n交货时间减少 95%；作者提出的转型目标，非普适要求", "notes": "读出“四倍”“百分之九十九”“百分之九十五”。强调这些是作者提出的转型目标，与原书其他小节口径不尽相同，绝非普适要求或十年结果保证。\n对应片段：04\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S10 本章总结.md#^llet-ch03-s10-p001\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S10 本章总结.md#^llet-ch03-s10-p002", "image": "assets/slides/L10/06.png", "time": 171.555, "segment": 4}, {"n": 7, "title": "应用练习", "text": "应用练习\n真北指标分别影响哪些财务项目\n倾向用能力削减成本还是支持增长\n本章参考文献见第3章参考文献小节", "notes": "说明这是整理者设计的练习，请学员填写，不预设答案。\n对应片段：05\nsource_revision：LLET-TEXT-v04\n证据：10_书籍/企业精益转型的领导之道/01_章节/CH03-S09 将真北指标与财务指标相关联.md#^llet-ch03-s09-p006", "image": "assets/slides/L10/07.png", "time": 237.197, "segment": 5}], "timingNote": "按音频片段定位；部分页面共用同一片段，可手动翻页。", "ppt": "课件/L10_第03章_将真北指标与财务指标相关联.pptx", "audio": "音频合集/L10_第03章_将真北指标与财务指标相关联.mp3", "exercises": "\n# 我的工作学习单：目标与度量\n\n复制本页填写即可。本练习是整理者设计，不是原书内容，不要求写长篇心得。\n\n## 先描述问题\n\n- 我的工作场景：____\n- 最近发生的一个具体问题：____\n- 已经知道的事实（不知道的写“待观察”）：____\n\n## 选择一个概念并联系工作\n\n- 本章哪个概念帮助我理解问题：____\n- 原书案例与我的工作相似在哪里：____\n- 条件有哪些不同，不能直接照搬什么：____\n\n## 先观察，再讨论改进\n\n| 项目 | 我的填写 |\n|---|---|\n| 指标名称与含义 | |\n| 单位、分子/分母（适用时） | |\n| 从哪里开始计时/计数，到哪里结束 | |\n| 观察哪类工作、哪个时间范围 | |\n| 当前值和数据来源；没有数据写待观察 | |\n| 还要关注哪个方向，避免只改善一项 | |\n| 一次小范围观察或尝试 | |\n| 参与人及复盘时间 | |\n\n## 学完自测\n\n不看PPT，用自己的话回答：只看财务结果为什么不足以确定下一步改进动作？我的例子里还缺什么事实？\n\n返回本单元 · 填写贯穿全课程的工作学习单\n", "duration": 271.76675736961454, "start": 2673.108888888889, "end": 2944.8756462585034}, {"id": "L11", "title": "从现状价值流识别浪费", "chapter": "第04章", "source": "第4章；附录A选读", "unit": "流程与改善", "status": "媒体已生成、内容复核通过；待听审", "pages": [{"n": 1, "title": "价值流与本单元的学习路线", "text": "价值流与本单元的学习路线\n客户需要到得到满足的全过程\n现状观察 → 未来状态 → 改善行动\n三讲沿用同一个工作问题\n流程与改善 · L11    1/6    原书第四章", "notes": "第1页。价值流与本单元的学习路线。第三章帮助我们用指标说明问题，这一单元进一步观察问题发生在哪些工作步骤。作者把价值流理解为客户提出需要到需要得到满足的一系列步骤。它既适用于产品，也适用于服务。三讲依次学习现状、未来状态和改善行动。请沿用前面选定的一个工作问题，最后形成一项有负责人和回看时间的行动。学习单由整理者设计，帮助你把原书方法联系到日常工作。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S00 章首导语.md#^llet-ch04-s00-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S00 章首导语.md#^llet-ch04-s00-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S11 本章总结.md#^llet-ch04-s11-p001", "image": "assets/slides/L11/01.png", "time": 0}, {"n": 2, "title": "现状图来自实际工作", "text": "现状图来自实际工作\n沿着工作逐步观察\n记录实际步骤与交接\n让参与者共同补齐过程\n流程与改善 · L11    2/6    原书第四章", "notes": "第2页。现状图来自实际工作。作者提醒，实际工作往往与纸面或电脑中的流程不同，也很少有人知道一项工作经历的全部步骤。因此，现状图需要沿着真实过程逐步观察，并请参与者一起补齐。练习时可以先写每一步做什么、交给谁，在哪里等待或返工。暂时不知道的内容标为待观察，不要凭印象补成完整图。这些记录栏目是本课程的简化安排，目的是让讨论建立在实际过程上。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S01 创建一个初始状态的 VSA.md#^llet-ch04-s01-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S01 创建一个初始状态的 VSA.md#^llet-ch04-s01-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S07 工作计划和职责.md#^llet-ch04-s07-p003", "image": "assets/slides/L11/02.png", "time": 50}, {"n": 3, "title": "现状还需要指标", "text": "现状还需要指标\n人员发展与质量\n交付延迟与资源消耗\n记录现状，保持前后口径一致\n流程与改善 · L11    3/6    原书第四章", "notes": "第3页。现状还需要指标。原书要求在初始价值流中记录真北指标的现状，涉及人员发展、质量、延迟以及资源消耗。只关注生产率或交货时间，容易遗漏人的发展和质量。结合第三章，学习单可以先选一项主要指标，同时记下还需关注的其他方面。例如资料交付的等待时间减少后，仍要检查返工有没有增加。这是整理者设计的应用例子。前后比较时保持对象、时间范围和单位一致，未知数据留待观察。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S02 初始状态的 VSA 和真北指标.md#^llet-ch04-s02-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S02 初始状态的 VSA 和真北指标.md#^llet-ch04-s02-p002", "image": "assets/slides/L11/03.png", "time": 99}, {"n": 4, "title": "原书案例：ThedaCare的价值流", "text": "原书案例：ThedaCare的价值流\n医疗服务同样有连续的工作步骤\n现状图帮助团队看见整个过程\n逐步讨论哪些活动创造价值\n流程与改善 · L11    4/6    原书第四章", "notes": "第4页。原书案例：ThedaCare的价值流。第四章以 ThedaCare 的初始价值流图说明，价值流分析并不限于制造现场。你可以从学习入口打开图四点一，观察一项服务如何经过多个步骤。作者建议用客户是否愿意为活动付费来帮助识别价值，并让管理者亲自参与初次分析。本讲借案例学习观察方法，不从图中推算未经核实的节省幅度。实际练习中，发现一个可疑步骤后，还要了解它为什么存在，不能只凭分类就决定删除。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S00 章首导语.md#^llet-ch04-s00-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S03 帮你发现浪费.md#^llet-ch04-s03-p001", "image": "assets/slides/L11/04.png", "time": 152}, {"n": 5, "title": "工作练习：一项交付的现状", "text": "工作练习：一项交付的现状\n写清开始、结束和接收者\n列出实际步骤，圈出一处等待或返工\n补上一项现状指标和证据\n流程与改善 · L11    5/6    原书第四章", "notes": "第5页。工作练习：一项交付的现状。现在暂停音频，打开共用工作学习单。选一项具体交付，写清从哪里开始、到哪里结束、谁接收。列出最近一次实际经过的步骤，圈出一处等待或返工，再写下你观察到的事实。如果只有猜测，明确标注待核实。最后补上一项现状指标，并注明记录来自哪里。练习不要求漂亮的流程图，一张让实际参与者能够补充和讨论的记录，就足以支持下一讲的学习。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S01 创建一个初始状态的 VSA.md#^llet-ch04-s01-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S02 初始状态的 VSA 和真北指标.md#^llet-ch04-s02-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S07 工作计划和职责.md#^llet-ch04-s07-p003", "image": "assets/slides/L11/05.png", "time": 204}, {"n": 6, "title": "小结：现状是后续行动的依据", "text": "小结：现状是后续行动的依据\n要点：看实际过程、共同观察、记录指标\n自测：已有流程文件为何还要到现场？\n行动：与一位参与者核对现状\n流程与改善 · L11    6/6    原书第四章", "notes": "第6页。小结：现状是后续行动的依据。本讲的三个要点是：观察实际工作，让参与者共同补齐过程，记录能够用于后续比较的指标。自测一下，已经有流程文件，为什么还要到现场？因为实际步骤可能与文件不同，交接中的等待或返工也可能没有被完整记录。你的下一步是与一位实际参与者核对学习单，修正自己不清楚的地方。下一讲在这些事实基础上讨论理想状态和可实施的未来状态。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S01 创建一个初始状态的 VSA.md#^llet-ch04-s01-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S01 创建一个初始状态的 VSA.md#^llet-ch04-s01-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S02 初始状态的 VSA 和真北指标.md#^llet-ch04-s02-p001", "image": "assets/slides/L11/06.png", "time": 256}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L11_第04章_从现状价值流识别浪费.pptx", "audio": "音频合集/L11_第04章_从现状价值流识别浪费.mp3", "exercises": "# 流程与改善：我的工作学习单\n\n整理者设计的练习。复制一份填写；三讲沿用同一项工作，未知内容写“待观察”。\n\n## L11：现状\n\n- 我的工作问题、接收者及其期望：____\n- 过程从哪里开始，到哪里结束：____\n- 最近一次实际步骤与交接：____ → ____ → ____\n- 一处等待或返工及观察证据：____\n- 主要现状指标、单位、记录时间及数据出处：____\n- 还需留意的质量、人员或其他影响：____\n- 与哪位实际参与者核对：____\n\n## L12：未来状态\n\n- 希望改变哪个步骤，为什么：____\n- 拟采用：直接处理／项目推进／集中改善活动。\n- 拟定目标及判断依据：____\n- 拟定负责人、参与岗位、日期：____\n- 尚需核实的条件或职责安排：____\n\n## L13：行动与回看\n\n| 项目 | 我的记录 |\n|---|---|\n| 准备采取的行动 | |\n| 需要的参与者与指导 | |\n| 行动前后同口径的事实或指标 | |\n| 回看日期与负责人 | |\n| 未完成事项和下一步 | |\n| 自己或团队学到的方法 | |\n\n## 我的收获\n\n- 我学到的三个要点：____／____／____\n- 自测：画图或活动结束为什么不等于问题解决？____\n- 愿意推进的一个行动及回看日期：____\n\n返回本单元与知识入口 · L11 · L12 · L13\n", "duration": 305.1971882086168, "start": 2944.8756462585034, "end": 3250.07283446712}, {"id": "L12", "title": "从理想状态到未来状态和计划", "chapter": "第04章", "source": "第4章", "unit": "流程与改善", "status": "媒体已生成、内容复核通过；待听审", "pages": [{"n": 1, "title": "理想状态与未来状态", "text": "理想状态与未来状态\n理想状态帮助打开思路\n未来状态考虑近期可以实施的改变\n原书提出6—18个月的计划视野\n流程与改善 · L12    1/6    原书第四章", "notes": "第1页。理想状态与未来状态。有了现状记录，下一步是思考工作怎样变得更好。原书先通过头脑风暴想象没有非增值活动的理想状态，再建立未来状态。两者用途不同：理想状态打开思路，未来状态要形成可以执行的改进计划。作者提出六到十八个月的计划视野，这是书中的安排，不是所有组织必须采用的期限。本课程练习先选一项能够核实和实施的改变，不要求一次重做整个流程。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S04 用头脑风暴法来建立理想状态价值流.md#^llet-ch04-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S05 创建一个未来状态的价值流.md#^llet-ch04-s05-p001", "image": "assets/slides/L12/01.png", "time": 0}, {"n": 2, "title": "未来状态需要对应的目标", "text": "未来状态需要对应的目标\n每个真北指标都要考虑未来目标\n目标与具体行动相联系\n改善幅度须结合实际情况判断\n流程与改善 · L12    2/6    原书第四章", "notes": "第2页。未来状态需要对应的目标。作者要求为未来状态中的真北指标设置改进目标，并确保行动计划可以实现。他用坏的减半、好的双倍表达挑战性目标。学习时要把这个表达与具体现场区分开：它不是无需测量就能成立的结果，也不是统一的人员削减要求。本课程建议先说明准备改变哪个步骤、怎样判断有效，同时查看质量、交付和人员方面是否出现不希望的变化。这是便于初学者应用的练习安排。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S06 改进目标.md#^llet-ch04-s06-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S06 改进目标.md#^llet-ch04-s06-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S02 初始状态的 VSA 和真北指标.md#^llet-ch04-s02-p002", "image": "assets/slides/L12/02.png", "time": 49}, {"n": 3, "title": "计划中的三类工作", "text": "计划中的三类工作\n可以直接完成的小改进\n需要协调推进的项目\n集中开展的改善活动\n流程与改善 · L12    3/6    原书第四章", "notes": "第3页。计划中的三类工作。原书把未来状态中的工作分为三类：可以由个人直接处理的快速改进，少数需要按项目推进的工作，以及集中开展的一周改善活动。分类有助于给行动安排合适的推进方式，不意味着所有事情都要开一次活动。落实到计划，还需要写明任务和日期。练习中再补上负责人和回看依据，让团队知道下一步由谁推进，以及用什么事实检查变化。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S05 创建一个未来状态的价值流.md#^llet-ch04-s05-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S07 工作计划和职责.md#^llet-ch04-s07-p001", "image": "assets/slides/L12/03.png", "time": 100}, {"n": 4, "title": "原书案例：ThedaCare重新设计工作", "text": "原书案例：ThedaCare重新设计工作\n反复回看已有价值流\n医生、药师与护士共同参与\n工作安排与空间布局一起调整\n流程与改善 · L12    4/6    原书第四章", "notes": "第4页。原书案例：ThedaCare重新设计工作。原书叙述，ThedaCare 在开展精益数年后重新研究已有价值流，发展模型线。在这一过程中，医生、药师和护士等共同参与工作方式的设计，工作安排与楼层布局也一起调整。这个案例说明，未来状态涉及多个岗位之间如何协同，不能只由画图者独自决定。本讲只采用原书对参与和设计过程的描述，不把案例报告的改善比例作为其他团队的承诺。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S09 典型价值流.md#^llet-ch04-s09-p009\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S09 典型价值流.md#^llet-ch04-s09-p011", "image": "assets/slides/L12/04.png", "time": 145}, {"n": 5, "title": "工作练习：一项未来状态方案", "text": "工作练习：一项未来状态方案\n针对一处现状问题提出改变\n选择推进方式，明确负责人和日期\n写清目标与需要验证的条件\n流程与改善 · L12    5/6    原书第四章", "notes": "第5页。工作练习：一项未来状态方案。请继续使用上一讲的学习单。针对圈出的等待或返工，提出一项改变，说明为什么它可能改善现状。判断这是可以直接处理的事项，还是需要跨岗位协调的项目或改善活动。写下拟定负责人、日期和判断结果的指标，并把尚未确认的条件列出来。这个方案是供实际参与者讨论的草案，不代表你已经获得了实施权限。先完成讨论，再按所在组织的职责安排推进。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S05 创建一个未来状态的价值流.md#^llet-ch04-s05-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S06 改进目标.md#^llet-ch04-s06-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S07 工作计划和职责.md#^llet-ch04-s07-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S07 工作计划和职责.md#^llet-ch04-s07-p003", "image": "assets/slides/L12/05.png", "time": 194}, {"n": 6, "title": "小结：图要转化为行动", "text": "小结：图要转化为行动\n要点：区分两种状态、明确目标、安排任务\n自测：画好未来状态为何还不算完成？\n行动：与相关岗位讨论一项方案\n流程与改善 · L12    6/6    原书第四章", "notes": "第6页。小结：图要转化为行动。本讲的三个要点是：用理想状态打开思路，用未来状态明确可执行的目标，把改变落实到任务和日期。自测一下，画好未来状态为什么还不算完成？因为如果没有真正实施和检查，图只是记录，不能证明工作已经改善。你的下一步是请相关岗位讨论学习单上的一项方案，核实它的条件和责任安排。下一讲学习改善活动怎样推进实施，以及为什么一次活动后仍需继续回看。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S04 用头脑风暴法来建立理想状态价值流.md#^llet-ch04-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH04-S05 创建一个未来状态的价值流.md#^llet-ch04-s05-p001\ sets/slides/L14/01.png", "time": 0}, {"n": 2, "title": "n/10：活动节奏的经验参考", "text": "n/10：活动节奏的经验参考\nn是选定范围内的人数\nn÷10≈年度改善活动数\n不保证固定业绩\n团队与人才 · L14    2/6    原书第5章；案例按原书记述", "notes": "第2页。n/10：活动节奏的经验参考。请看活动节奏。按照原书的人数与活动例子理解，n指选定价值流或转型范围内的人数。n除以十，是年度改善活动数量的经验参考。原书用一千人对应每年约一百次活动来说明。这里算的是活动次数，不是每次参加多少人，更不是新增人数。原译文有一句把单位写成人数，我们依据同段例子解释，不改原文。作者强调真正的过程研究和改变，不能只凑次数，也不能保证活动办满就获得固定增长。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S01 n／10 规则.md#^llet-ch05-s01-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S01 n／10 规则.md#^llet-ch05-s01-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S01 n／10 规则.md#^llet-ch05-s01-p005", "image": "assets/slides/L14/02.png", "time": 47}, {"n": 3, "title": "原书案例：FNOK逐年建立节奏", "text": "原书案例：FNOK逐年建立节奏\n1992年：200次，年中启动\n1993年：600次\n1994年：达到1000次目标\n团队与人才 · L14    3/6    原书第5章；案例按原书记述", "notes": "第3页。原书案例：FNOK逐年建立节奏。原书中的FNOK约有五千人，采用更高的n除以五目标，对应每年一千次活动。它没有在第一年就达到目标：一九九二年年中启动，开展二百次；一九九三年六百次；一九九四年达到一千次。学习重点是逐步建立研究和改善的能力。它的n除以五不同于一般的n除以十参考，不能混为一谈。这组历史经验也不能证明活动数量是收益变化的唯一原因。本课保留必要的活动数字，详细年度财务数据可回到原书查询。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S01 n／10 规则.md#^llet-ch05-s01-p007\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S01 n／10 规则.md#^llet-ch05-s01-p009", "image": "assets/slides/L14/03.png", "time": 104}, {"n": 4, "title": "活动团队与专职支持，职责不同", "text": "活动团队与专职支持，职责不同\n活动团队：现场人员、经验成员、学习者\n专职支持：准备、实施、跟进\n约3%是经验参考\n团队与人才 · L14    4/6    原书第5章；案例按原书记述", "notes": "第4页。活动团队与专职支持，职责不同。现在区分两类安排。活动团队围绕一个具体过程共同研究，作者在设计团队一节建议六到九人，既有熟悉现场的人，也有经验成员和为学习而参加的人。专职支持则把活动前准备、活动中帮助和活动后问题解决接起来。作者给出的规模经验约为选定范围员工的百分之三，并强调这些资源不能总被日常救急挤占。这是作者的经验法则，不是对每家企业立即下达的编制要求。团队人数与专职人员比例，分母和用途也不同。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p002-list\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S04 3% 方针.md#^llet-ch05-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S04 3% 方针.md#^llet-ch05-s04-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S04 3% 方针.md#^llet-ch05-s04-p003", "image": "assets/slides/L14/04.png", "time": 162}, {"n": 5, "title": "把后续问题放进计划", "text": "把 e": "怎样选择成员和领导者", "chapter": "第05章", "source": "第5章：成员、领导、管理团队", "unit": "团队与人才", "status": "使用版验收通过", "pages": [{"n": 1, "title": "先分清三种角色", "text": "先分清三种角色\n一次改善活动的团队\n长期专职支持团队\n管理流程改善团队\n团队与人才 · L15    1/6    原书第5章；案例按原书记述", "notes": "第1页。先分清三种角色。这一讲回答谁参加、谁带领，以及谁支持办公室里的流程。三类安排容易混在一起：一个人提供某次活动的经验，不代表他已是长期专职成员；一个高级经理也不必担任活动组长。我们沿着原书的团队设计、成员与领导选择、管理团队几节，分别理解这些角色。学完后，请为自己熟悉的一项工作提出角色建议，而不是直接列一张人员任命表。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S08 管理团队.md#^llet-ch05-s08-p001", "image": "assets/slides/L15/01.png", "time": 0}, {"n": 2, "title": "让现场经验和改善经验相遇", "text": "让现场经验和改善经验相遇\n主管和本领域成员了解过程\n经验成员帮助研究和改善\n管理者亲身参加学习\n团队与人才 · L15    2/6    原书第5章；案例按原书记述", "notes": "第2页。让现场经验和改善经验相遇。作者在团队设计一节建议六到九人的团队。活动团队中有本领域主管和两到三名本领域成员，也有一到两名经验丰富的成员，另外可安排一到两名学习者，但学习者人数不应超过有经验的成员。原书给出范围，不要求把每个上限都填满。经验成员适合引导研究，区域主管要理解新过程并在活动后接手。作者还提醒，高级管理者应作为全程参与的成员学习，不因职位高就自然成为活动领导。只参加一会儿又离开，会影响自己的学习和团队配合。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p002-list\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p005", "image": "assets/slides/L15/02.png", "time": 47}, {"n": 3, "title": "专职成员：看见问题，也能一起解决", "text": "专职成员：看见问题，也能一起解决\n愿意学习\n认识问题与解决问题\n合作和沟通\n团队与人才 · L15    3/6    原书第5章；案例按原书记述", "notes": "第3页。专职成员：看见问题，也能一起解决。选择专职成员时，作者列出学习、认识和解决问题、团队合作、沟通这几方面。他特别区分认识问题与解决问题：没有看见问题，掌握工具也难以发挥作用。这里不是挑当前最空闲的人。书中还讨论制造场景的技术知识，以及未来管理者和内部导师的不同培养路径。本课不要求背诵所有比例和年限，而要理解人选应与问题和培养方向相配。整理者建议，用一次具体行为说明某项能力，比只写沟通能力强更有帮助。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p002-list\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p004\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p007\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p008", "image": "assets/slides/L15/03.png", "time": 108}, {"n": 4, "title": "领导者：把精益放进接班与发展安排", "text": "领导者：把精益放进接班与发展安排\n作者建议业务继任者领导专职团队\n通过实践积累经验\n培养内部导师\n团队与人才 · L15    4/6    原书第5章；案例按原书记述", "notes": "第4页。领导者：把精益放进接班与发展安排。作者担心一种情形：现任总经理积极推动精益，几年后换人，继任者没有亲身参与，转型可能中断。因此，他建议由工厂或业务单元的继任人选领导专职团队，让重要管理人才在实践中学习，而不是找一个恰好可用的人占位置。这是作者的组织发展建议，不是只凭职位名称就保证成功。专职团队还承担培养内部导师的作用，经验需要在持续改善活动中积累。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S06 为专职精益团队挑选领导.md#^llet-ch05-s06-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S06 为专职精益团队挑选领导.md#^llet-ch05-s06-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S06 为专职精益团队挑选领导.md#^llet-ch05-s06-p004", "image": "assets/slides/L15/04.png", "time": 168}, {"n": 5, "title": "原书案例：办公室的报告也能改善", "text": "原书案例：办公室的报告也能改善\n逐项查看报告使用情况\n年报告数1920→1236\n原书约36%，不是全公司效率提升36%\n团队与人才 · L15    5/6    原书第5章；案例按原书记述", "notes": "第5页。原书案例：办公室的报告也能改善。原书引述HON一九九八年的活动邮件。团队通过帕累托分析确定主要使用者，逐项查看报告使用情况，并问五个为什么。两个小组的年报告数量从一千九百二十减少到一千二百三十六，书中写减少百分之三十六，按数量计算约百分之三十五点六。对象是报告数量，不是全公司生产率。这个案例提醒我们，办公室的信息传递也值得研究，懂信息系统或财务流程的人可能是重要成员。原书未在这段提供完整对照研究，不能把这些数字当成任意流程的预期收益。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S08 管理团队.md#^llet-ch05-s08-p007\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S08 管理团队.md#^llet-ch05-s08-p008\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S08 管理团队.md#^llet-ch05-s08-p009", "image": "assets/slides/L15/05.png", "time": 219}, {"n": 6, "title": "工作联系与小结", "text": "工作联系与小结\n3个要点：角色互补、领导实践、办公室也有流程\n自测：职位最高者一定做组长吗？\n行动：列出问题所需能力\n团队与人才 · L15    6/6    原书第5章；案例按原书记述", "notes": "第6页。工作联系与小结。请暂停，选择一个真实问题，例如订单信息反复补填。这是练习情境，不是书中案例。写出谁了解当前工作，谁有改善经验，谁理解相关系统，再写自己最需要向谁学习。回顾三个要点：角色要互补，领导者通过实践发展能力，管理工作也要沿流程找问题。职位最高者不一定适合做活动组长，还要看经验和学习角色。你的小行动是提出角色建议并沟通，不凭本课直接作人员任命。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S02 设计改进团队.md#^llet-ch05-s02-p005\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S05 为全职改进团队挑选成员.md#^llet-ch05-s05-p002-list\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S08 管理团队.md#^llet-ch05-s08-p003", "image": "assets/slides/L15/06.png", "time": 282}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L15_第05章_怎样选择成员和领导者.pptx", "audio": "音频合集/L15_第05章_怎样选择成员和领导者.mp3", "exercises": "# 第五章工作学习单\n\n整理者设计的练习；选一个真实工作问题，三讲共用这一张。未知写“待观察”，不要求立即调整组织或人员。\n\n- 我的岗位与流程：____\n- 一次可观察的问题或事实：____\n\n## L14：补一处支持缺口\n\n- 当前改善范围：____\n- 一个未完成事项／活动后新暴露的问题：____\n- 需要谁提供什么支持：____\n- 与相关同事讨论的跟进人及复查时间：____\n- 自测：年度活动次数与专职支持人数有什么不同？____\n\n## L15：按问题选择角色\n\n- 谁了解现场工作：____\n- 谁能指导改善：____\n- 谁理解所需系统或技术：____\n- 我需要学习的能力及一项可观察行为：____\n- 自测：职位最高者为什么未必适合任活动组长？____\n\n## L16：一次实践学习\n\n- 我想学会的技能：____\n- 可以请教的人：____\n- 一次小范围观察或实践：____\n- 复盘时间及要观察的变化：____\n- 哪些书中做法不适合直接照搬，为什么：____\n\n## 单元小结\n\n我的三个要点：____ / ____ / ____\n我的一个行动：____\n\n返回本单元\n", "duration": 336.15913832199544, "start": 4181.1239455782315, "end": 4517.283083900227}, {"id": "L16", "title": "Watlow经验与持续培养", "chapter": "第05章", "source": "第5章：Watlow经验、调配、培训；附录B", "unit": "团队与人才", "status": "使用版验收通过", "pages": [{"n": 1, "title": "让支持、培养与调配连起来", "text": "让支持、培养与调配连起来\n支持改善\n培养人才\n为释放出的能力安排去向\n团队与人才 · L16    1/6    原书第5章；案例按原书记述", "notes": "第1页。让支持、培养与调配连起来。这是本单元最后一讲。前两讲讨论活动节奏与团队人选，现在要把支持、培养和调配连起来。先看第五章的Watlow经验，再看人员调配与培训。第三章也有这家企业的报价和样件流程案例，但本讲的年度人员支持记录是另一组材料，不能拼成同一次实验。学完后，你要能为自己的工作提出一个小范围学习与支持安排。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S09 调配.md#^llet-ch05-s09-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S10 其他精益培训.md#^llet-ch05-s10-p001", "image": "assets/slides/L16/01.png", "time": 0}, {"n": 2, "title": "Watlow：全职支持比例逐年变化", "text": "Watlow：全职支持比例逐年变化\n2005：1.4%；2006：1.7%；2007：2.3%\n2008：2.7%；2009：3.1%\n原书：2009年5月达到3%目标\n团队与人才 · L16    2/6    原书第5章；案例按原书记述", "notes": "第2页。Watlow：全职支持比例逐年变化。原书报告，全职精益团队占员工的比例，二〇〇五年百分之一点四，二〇〇六年百分之一点七，二〇〇七年百分之二点三，二〇〇八年百分之二点七，二〇〇九年百分之三点一。书中还说明二〇〇九年五月达到百分之三目标。这是一段逐步建立支持能力的过程。数字是人员比例，不是利润率，也不是改善达成率。保留年份是为了看清过程，而不是让学员背下五个数字套用。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p004\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p005\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p007", "image": "assets/slides/L16/02.png", "time": 46}, {"n": 3, "title": "数量之外，还要看能力能否接续", "text": "数量之外，还要看能力能否接续\n目标与人才培育相连\n成员晋升后仍需补充支持能力\n经验关联不是固定因果阈值\n团队与人才 · L16    3/6    原书第5章；案例按原书记述", "notes": "第3页。数量之外，还要看能力能否接续。二〇〇七年的记述提到文化与人才培育，二〇〇八年把真北指标、目标和工作责任连接起来，二〇〇九年则提到成员晋升后，支持和教学承受压力。支持能力不仅是人数，还包括经验能否积累、导师能否接续。作者用这些经验说明专职支持的重要性，但不能据此断言每个组织达到百分之三必定成功，或者不足百分之三必定失败。原书本节有一个未给全称的缩写，本课直接讲支持和教学，不替它编造名称。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p005\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p007\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S07 Watlow 的 3% 经验.md#^llet-ch05-s07-p008", "image": "assets/slides/L16/03.png", "time": 98}, {"n": 4, "title": "调配：改善之后，能力去哪里？", "text": "调配：改善之后，能力去哪里？\n原书讨论重新部署与新工作机会\n暂时没有岗位时安排学习或改善工作\n不将歧义句变成人事指令\n团队与人才 · L16    4/6    原书第5章；案例按原书记述", "notes": "第4页。调配：改善之后，能力去哪里？。原书介绍的一种思路，是过程改善释放人员能力后，把优秀成员安排到新的工作或改善任务，让团队看到发展机会。暂时没有合适岗位时，可参加专职改善小组或为未来岗位培训。我们学习的是改善之后考虑人员发展和能力去向，而不只计算少用了多少人。同节译文有解雇措辞和一处未完成的句子，与重新部署的叙述需要区分。本课不据此讲裁员步骤，也不补造缺失结论；实际人员安排应在具体组织中充分沟通。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S09 调配.md#^llet-ch05-s09-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S09 调配.md#^llet-ch05-s09-p005", "image": "assets/slides/L16/04.png", "time": 154}, {"n": 5, "title": "培训：三类对象，共同落到实践", "text": "培训：三类对象，共同落到实践\n所有员工：原则与基本概念\n专职团队：角色与专业能力\n高层领导：阅读讨论与亲身实践\n团队与人才 · L16    5/6    原书第5章；案例按原书记述", "notes": "第5页。培训：三类对象，共同落到实践。作者建议所有员工学习基本原则和概念，可以分散在几个星期或几个月中；专职团队要理解新角色和工作，也需要老师指导；高层领导可以阅读、讨论和参加研讨，但最深学习仍来自活动中的亲身经验。书中HON的学习路线图是一种游戏板式教学安排，和本课程的可点击导航不是同一件工具。我们借鉴便于理解和联系工作的目的，不宣称复刻原书整套培训产品。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S10 其他精益培训.md#^llet-ch05-s10-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S10 其他精益培训.md#^llet-ch05-s10-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S10 其他精益培训.md#^llet-ch05-s10-p004", "image": "assets/slides/L16/05.png", "time": 211}, {"n": 6, "title": "单元收尾：一个人、一个问题、一次复盘", "text": "单元收尾：一个人、一个问题、一次复盘\n3个要点：支持不断、人才成长、能力有去向\n自测：听完课就掌握改善了吗？\n行动：一次带问题的实践学习\n团队与人才 · L16    6/6    原书第5章；案例按原书记述", "notes": "第6页。单元收尾：一个人、一个问题、一次复盘。最后把三讲连起来：持续改善需要稳定支持，支持过程也应培养人才，释放出来的能力需要新的用途。请暂停，在工作学习单选择一个真实问题，写下要学的技能、可以请教的人和一次小范围观察或实践安排。不要虚构成果，未知写待观察。自测答案是：听完课、看完PPT不等于掌握改善，还要观察、尝试并复盘。你的下一步可以是与有经验的同事共同观察一次流程，约定何时讨论问题。这是整理者设计的学习行动。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S10 其他精益培训.md#^llet-ch05-s10-p004\n10_书籍/企业精益转型的领导之道/01_章节/CH05-S11 本章总结.md#^llet-ch05-s11-p002-list", "image": "assets/slides/L16/06.png", "time": 262}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L16_第05章_Watlow经验与持续培养.pptx", "audio": "音频合集/L16_第05章_Watlow经验与持续培养.mp3", "exercises": "# 第五章工作学习单\n\n整理者设计的练习；选一个真实工作问题，三讲共用这一张。未知写“待观察”，不要求立即调整组织或人员。\n\n- 我的岗位与流程：____\n- 一次可观察的问题或事实：____\n\n## L14：补一处支持缺口\n\n- 当前改善范围：____\n- 一个未完成事项／活动后新暴露的问题：____\n- 需要谁提供什么支持：____\n- 与相关同事讨论的跟进人及复查时间：____\n- 自测：年度活动次数与专职支持人数有什么不同？____\n\n## L15：按问题选择角色\n\n- 谁了解现场工作：____\n- 谁能指导改善：____\n- 谁理解所需系统或技术：____\n- 我需要学习的能力及一项可观察行为：____\n- 自测：职位最高者为什么未必适合任活动组长？____\n\n## L16：一次实践学习\n\n- 我想学会的技能：____\n- 可以请教的人：____\n- 一次小范围观察或实践：____\n- 复盘时间及要观察的变化：____\n- 哪些书中做法不适合直接照搬，为什么：____\n\n## 单元小结\n\n我的三个要点：____ / ____ / ____\n我的一个行动：____\n\n返回本单元\n", "duration": 324.6096598639456, "start": 4517.283083900227, "end": 4841.892743764172}, {"id": "L17", "title": "领导参与、沟通与指导联盟", "chapter": "第06章", "source": "第6章", "unit": "战略与推进", "status": "媒体、内容复核及PPT逐页检查通过；音频待听审", "pages": [{"n": 1, "title": "战略推进与本单元路线", "text": "战略推进与本单元路线\n领导者在实践中学习\n把方向连接到价值流改进\n通过回顾支持持续推进\n战略与推进 · L17    1/6    原书第六章", "notes": "第1页。战略推进与本单元路线。前面已经学习怎样观察流程、组织改善和支持人员。这一单元进一步回答，组织怎样让这些行动围绕同一个方向持续进行。原书第六章强调，领导者需要改变看待和组织工作的方式。三讲依次学习领导参与、战略部署和持续推进。请继续使用你熟悉的工作问题，思考它与组织方向有什么关系，需要谁支持。本单元练习由整理者设计，用来形成一份简明的推进草案。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S00 章首导语.md#^llet-ch06-s00-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S13 本章总结.md#^llet-ch06-s13-p001", "image": "assets/slides/L17/01.png", "time": 0}, {"n": 2, "title": "领导参与需要实践和指导", "text": "领导参与需要实践和指导\n在实际工作中学习看见浪费\n通过导师支持积累个人经验\n课堂学习是起点，仍需现场运用\n战略与推进 · L17    2/6    原书第六章", "notes": "第2页。领导参与需要实践和指导。作者把精益学习描述为需要个人努力的实践型学习。领导者学习工具之后，还要在工作中积累经验，才能改变看问题的方式。第六章提出，在有经验者指导下制定学习计划，以精益方式组织自己的工作。对学员而言，可以先问自己，最近亲自观察过哪个过程，从哪里发现问题，遇到困难时向谁学习。这些是课程设计的练习问题，不要求所有岗位采用相同的培训时长。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p005", "image": "assets/slides/L17/02.png", "time": 51}, {"n": 3, "title": "原书案例：HON/HNI的浸入式学习", "text": "原书案例：HON/HNI的浸入式学习\n新管理人员首年参加四次一周活动\n经历生产、价值流、管理及设计学习\n重点是把概念用到不同工作中\n战略与推进 · L17    3/6    原书第六章", "notes": "第3页。原书案例：HON/HNI的浸入式学习。原书描述，HON/HNI的新管理人员在第一年参加四次为期一周的改善活动，依次涉及生产区的标准工作、价值流分析、管理工作，以及产品和工艺设计。这个历史案例说明，领导者不是只听一次介绍，而是在不同工作中学习发现浪费。这里沿用原书的企业并称，不把次数和周数当作所有组织必须遵守的标准，也不承诺活动一定消除某个比例的浪费。可借鉴的是有计划地安排实践和学习。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p003", "image": "assets/slides/L17/03.png", "time": 103}, {"n": 4, "title": "指导联盟与共同沟通", "text": "指导联盟与共同沟通\n多位高级管理者共同支持转型\n先选重要价值流，并安排资源\n说清原因、方式、预期效果和职责\n战略与推进 · L17    4/6    原书第六章", "notes": "第4页。指导联盟与共同沟通。原书中的指导联盟，是支持和引导转型的高级管理小组。它需要学习并帮助其他领导者成长，选择重要价值流，安排推进所需资源。沟通部分则提出四个问题：为什么需要改变，为什么选择这种方式，预期产生什么效果，每个人承担什么职责。把信息告诉大家一次，并不等于已经形成共同理解。本课采用这些问题帮助梳理沟通，不采用原书中缺少来源口径的记忆百分比。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S04 沟通（信息共享）.md#^llet-ch06-s04-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S04 沟通（信息共享）.md#^llet-ch06-s04-p003-list", "image": "assets/slides/L17/04.png", "time": 158}, {"n": 5, "title": "工作练习：一项改善需要谁支持", "text": "工作练习：一项改善需要谁支持\n写出与客户或组织方向的联系\n列出负责人、参与岗位和指导者\n用四个沟通问题解释行动\n战略与推进 · L17    5/6    原书第六章", "notes": "第5页。工作练习：一项改善需要谁支持。请暂停音频，打开共用学习单。沿用前面的一项改善，写出它为什么值得做，以及与客户需要或组织方向有什么联系。列出谁负责推进，需要哪些岗位参与，谁能提供指导或协调资源。再用本讲的四个沟通问题，写一段同事能听懂的说明。不确定的效果写成待验证目标，不把计划写成已经发生的成果。完成后，请一位相关同事反馈他是否理解目的和自己的职责。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p007-list\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S04 沟通（信息共享）.md#^llet-ch06-s04-p003-list", "image": "assets/slides/L17/05.png", "time": 210}, {"n": 6, "title": "小结：方向需要有人共同推进", "text": "小结：方向需要有人共同推进\n要点：亲自学习、共同支持、持续沟通\n自测：发出通知是否等于形成共识？\n行动：核对一位参与者的理解\n战略与推进 · L17    6/6    原书第六章", "notes": "第6页。小结：方向需要有人共同推进。本讲记住三个要点：领导者需要亲自学习，多位管理者需要共同支持推进，沟通要围绕改变的原因和职责持续展开。自测一下，发出通知是否就等于形成共识？还需要了解参与者是否理解为什么做、怎样做和自己承担什么。你的一个行动是请一位实际参与者复述学习单上的安排，并补齐不清楚之处。下一讲把这些支持与组织目标、价值流行动和月度回顾连接起来。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p005\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S04 沟通（信息共享）.md#^llet-ch06-s04-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S04 沟通（信息共享）.md#^llet-ch06-s04-p003-list", "image": "assets/slides/L17/06.png", "time": 263}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L17_第06章_领导参与、沟通与指导联盟.pptx", "audio": "音频合集/L17_第06章_领导参与、沟通与指导联盟.mp3", "exercises": "# 战略与推进：我的工作学习单\n\n整理者设计，复制一份填写。沿用熟悉的工作问题；事实不明处标“待核实”。\n\n## L17：方向与支持\n\n- 工作问题及客户或组织方向：____\n- 为什么改变，为什么选择此方式：____\n- 预期效果（待验证）：____\n- 负责人、参与岗位、指导者与支持需求：____\n- 向谁核对理解，对方有哪些疑问：____\n\n## L18：目标、行动与回顾\n\n| 项目 | 我的记录 |\n|---|---|\n| 一项目标及对应指标、单位和现状 | |\n| 准备改变的价值流或步骤 | |\n| 一项具体行动及负责人 | |\n| 支持需求和回顾日期 | |\n| 实际结果与证据（行动后填写） | |\n| 原因：事实与待验证猜测分开 | |\n| 补救或下个月的行动 | |\n\n## L19：后续学习与推进\n\n- 一次反复及已经观察到的事实：____\n- 一项实际担忧，需要什么回答或共同观察：____\n- 需要谁指导，准备怎样学习：____\n- 下一步行动、负责人、回看日期：____\n\n## 我的总结\n\n- 学到的三个要点：____／____／____\n- 自测：局部成果为何不能直接等同整体转型完成？____\n- 我愿意推进的一个行动：____\n\n返回单元与知识入口 · L17 · L18 · L19\n", "duration": 314.42272108843537, "start": 4841.892743764172, "end": 5156.315464852608}, {"id": "L18", "title": "战略部署与可视化管理", "chapter": "第06章", "source": "第6章；附录A/C选读", "unit": "战略与推进", "status": "媒体、内容复核及PPT逐页检查通过；音频待听审", "pages": [{"n": 1, "title": "战略部署的连接关系", "text": "战略部署的连接关系\n组织方向 → 真北目标\n价值流改进 → 具体行动\n每月回顾 → 调整后续计划\n战略与推进 · L18    1/6    原书第六章", "notes": "第1页。战略部署的连接关系。作者介绍战略部署时，强调把组织方向、真北指标、改善途径和每月复查机制连起来。它不只是把年度数字分到各部门，还要说明哪些过程改变能够帮助实现目标。学习时可以沿一条简明路线思考：组织要解决什么问题，用哪些指标判断，准备改哪个价值流，行动后怎样回顾。这条路线是课程对原书正文的教学整理，帮助初学者理解各部分之间的关系。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p003", "image": "assets/slides/L18/01.png", "time": 0}, {"n": 2, "title": "目标需要具体的价值流行动", "text": "目标需要具体的价值流行动\n为年度目标选择价值流改进\n明确活动重点与支持人员\n检查行动是否足以支持目标\n战略与推进 · L18    2/6    原书第六章", "notes": "第2页。目标需要具体的价值流行动。原书提出，改善目标需要逐层落实，在创造价值的层面形成工作计划。典型问题包括，要进行什么价值流改进，需要哪些活动，活动聚焦什么，以及谁支持这些活动。学员练习先从一项目标和一项行动开始，避免为了填表列出很多没有联系的任务。行动安排是否足够，还需要结合现状、资源和实施结果判断，不能仅凭活动数量证明目标能够实现。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p004-list\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p007", "image": "assets/slides/L18/02.png", "time": 49}, {"n": 3, "title": "月度回顾关注原因与下一步", "text": "月度回顾关注原因与下一步\n先看目标与实际结果\n讨论行动、原因和学习\n安排补救及下个月的工作\n战略与推进 · L18    3/6    原书第六章", "notes": "第3页。月度回顾关注原因与下一步。原书的月度回顾先简要查看目标是否达到，再讨论上个月实施了哪些重点改善，学到了什么。如果目标没有完成，团队需要提出补救行动，并检查下个月的计划是否足够。管理者的作用包括帮助识别整改步骤和协调支持。本课保留这种回顾顺序，不把书中的会议时长或时间比例规定为统一标准。回顾的结果应让参与者知道下一步做什么，而不只是重复报数字。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p006\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p007\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p008", "image": "assets/slides/L18/03.png", "time": 97}, {"n": 4, "title": "原书实例：Watlow任务控制室入口", "text": "原书实例：Watlow任务控制室入口\n指导联盟有日常会面与回顾地点\n计划、学习安排和指标共同展示\n详细案例可从附录C继续阅读\n战略与推进 · L18    4/6    原书第六章", "notes": "第4页。原书实例：Watlow任务控制室入口。第六章介绍转型工作控制室时，指向附录C的Watlow任务控制室案例。正文建议把转型分析、领导者发展计划、战略部署计划、重点价值流计划和真北指标直观展示在共同空间。本讲只采用第六章对控制室用途和资料组成的介绍，附录C作为进一步选读，不据此编造案例成效。学员可以先理解，共同可见的资料是为了帮助团队讨论行动与进展，漂亮的展示本身不能证明改善发生。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p011\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p008", "image": "assets/slides/L18/04.png", "time": 147}, {"n": 5, "title": "工作练习：一页推进与回顾记录", "text": "工作练习：一页推进与回顾记录\n一项目标、一个指标、一项行动\n负责人、支持需求与回顾日期\n实际结果、原因和下一步\n战略与推进 · L18    5/6    原书第六章", "notes": "第5页。工作练习：一页推进与回顾记录。请继续使用同一张学习单。写下一项目标、一项可以观察的指标和一项价值流行动，注明负责人、支持需求和回顾日期。行动发生后，再补实际结果、对原因的认识和下一步。把事实与猜测分开，没有记录的地方留空并标明待观察。这张一页记录是整理者设计的简化练习，用来体验目标与行动之间的联系，不替代所在组织正式的战略决策或完整年度规划。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p003\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p004-list\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p008", "image": "assets/slides/L18/05.png", "time": 199}, {"n": 6, "title": "小结：用回顾支持目标实现", "text": "小结：用回顾支持目标实现\n要点：目标连行动、资料共同可见、回顾原因\n自测：指标未达成时还应讨论什么？\n行动：约定一次简短回顾\n战略与推进 · L18    6/6    原书第六章", "notes": "第6页。小结：用回顾支持目标实现。本讲的三个要点是，把目标连接到具体行动，让相关计划和结果共同可见，通过回顾学习原因并调整工作。自测一下，发现指标没有达到后，除了再次报出差距，还应讨论什么？可以回顾实施了哪些行动，哪些条件没有满足，需要什么补救，以及下一步由谁支持。请与参与者约定一次简短回顾。下一讲讨论为什么转型过程会反复，以及如何面对疑问和保持后续学习。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S03 指导联盟.md#^llet-ch06-s03-p011\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p007\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S06 战略部署.md#^llet-ch06-s06-p008", "image": "assets/slides/L18/06.png", "time": 249}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L18_第06章_战略部署与可视化管理.pptx", "audio": "音频合集/L18_第06章_战略部署与可视化管理.mp3", "exercises": "# 战略与推进：我的工作学习单\n\n整理者设计，复制一份填写。沿用熟悉的工作问题；事实不明处标“待核实”。\n\n## L17：方向与支持\n\n- 工作问题及客户或组织方向：____\n- 为什么改变，为什么选择此方式：____\n- 预期效果（待验证）：____\n- 负责人、参与岗位、指导者与支持需求：____\n- 向谁核对理解，对方有哪些疑问：____\n\n## L18：目标、行动与回顾\n\n| 项目 | 我的记录 |\n|---|---|\n| 一项目标及对应指标、单位和现状 | |\n| 准备改变的价值流或步骤 | |\n| 一项具体行动及负责人 | |\n| 支持需求和回顾日期 | |\n| 实际结果与证据（行动后填写） | |\n| 原因：事实与待验证猜测分开 | |\n| 补救或下个月的行动 | |\n\n## L19：后续学习与推进\n\n- 一次反复及已经观察到的事实：____\n- 一项实际担忧，需要什么回答或共同观察：____\n- 需要谁指导，准备怎样学习：____\n- 下一步行动、负责人、回看日期：____\n\n## 我的总结\n\n- 学到的三个要点：____／____／____\n- 自测：局部成果为何不能直接等同整体转型完成？____\n- 我愿意推进的一个行动：____\n\n返回单元与知识入口 · L17 · L18 · L19\n", "duration": 301.55972789115646, "start": 5156.315464852608, "end": 5457.875192743764}, {"id": "L19", "title": "持续推进与转型阶段", "chapter": "第06章", "source": "第6章；附录D/E选读", "unit": "战略与推进", "status": "媒体、内容复核及PPT逐页检查通过；音频待听审", "pages": [{"n": 1, "title": "持续推进需要时间与经验", "text": "持续推进需要时间与经验\n新方法需要反复运用\n局部成果不等于整体转型完成\n阶段描述用于理解，不是交付承诺\n战略与推进 · L19    1/6    原书第六章", "notes": "第1页。持续推进需要时间与经验。原书把精益转型描述为需要持续努力的学习过程。早期可能已经出现局部成果，但组织的整体表现和工作习惯未必同步改变。作者用四年的阶段描述帮助读者理解这个过程。本课把它作为作者的经验概括，不作为每个组织的固定工期或收益承诺。学习重点是观察参与者的经验、行动的持续性以及工作方式是否改变，不能仅按经过了几年判断已经完成转型。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S08 年复一年的精益改革.md#^llet-ch06-s08-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S09 第一年.md#^llet-ch06-s09-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S12 第四年.md#^llet-ch06-s12-p002", "image": "assets/slides/L19/01.png", "time": 0}, {"n": 2, "title": "原书的四个阶段", "text": "原书的四个阶段\n第一年学习，第二年面对阻力\n第三年巩固经验与成果\n第四年持续改变逐渐成为常态\n战略与推进 · L19    2/6    原书第六章", "notes": "第2页。原书的四个阶段。原书描述，第一年常见边做边学和前进后退；第二年仍会面对阻力，许多人尚未积累直接经验；第三年经验与成果逐渐巩固；第四年持续改变逐渐成为新的常态。这是帮助理解长期变化的阶段叙述，不意味着每家组织都按同样日历发展。本讲不引用缺少统计口径的员工或价值流覆盖比例作为验收标准。回到实际工作，应检查行为和过程的证据，而不是只给自己贴一个阶段名称。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S09 第一年.md#^llet-ch06-s09-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S10 第二年.md#^llet-ch06-s10-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S11 第三年.md#^llet-ch06-s11-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S12 第四年.md#^llet-ch06-s12-p001", "image": "assets/slides/L19/02.png", "time": 48}, {"n": 3, "title": "原书案例回看：Danaher的导师安排", "text": "原书案例回看：Danaher的导师安排\n新领导者的学习采用正式计划\n导师在实践过程中持续指导\n学习支持贯穿一段时间\n战略与推进 · L19    3/6    原书第六章", "notes": "第3页。原书案例回看：Danaher的导师安排。第六章的Danaher案例描述，新领导者经历一个十三周的正式学习过程，由熟悉其业务系统的高级经理担任导师，制定具体计划并持续指导。本讲回看这个历史案例，是为了说明学习支持需要落实到安排和持续实践，而不是一次课程后就结束。十三周是该案例的做法，不能由此推导所有组织应采用相同周期，更不能把它与原书四年阶段描述直接换算。可以借鉴的是有计划、有指导地积累经验。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p004", "image": "assets/slides/L19/03.png", "time": 99}, {"n": 4, "title": "疑问与持续拒绝参与需要区分", "text": "疑问与持续拒绝参与需要区分\n有人担心改变会损害已有成果\n先理解疑问，再澄清方向与职责\n不因提出问题就给同事贴标签\n战略与推进 · L19    4/6    原书第六章", "notes": "第4页。疑问与持续拒绝参与需要区分。原书用抗体比喻保护旧文化、抵制改变的力量，也提醒读者，面对全新方向，有思想的人首先提出疑问是正常的，不能把所有质疑者都归为抗体。作者区分真诚疑问与不接受回答、不愿参与的持续抵制。本课采用这一辨别提醒，引导学员记录具体担忧和事实，不根据称呼判断某个人。涉及人员安排时，需要由组织依职责处理，本练习只用于沟通和观察，不把书中的强硬措辞当作直接处置指令。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S07 “抗体”.md#^llet-ch06-s07-p004\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S07 “抗体”.md#^llet-ch06-s07-p008", "image": "assets/slides/L19/04.png", "time": 153}, {"n": 5, "title": "工作练习：下一轮学习与推进", "text": "工作练习：下一轮学习与推进\n记录一次反复和已知原因\n写下一项需回应的实际担忧\n安排指导、后续行动和回看\n战略与推进 · L19    5/6    原书第六章", "notes": "第5页。工作练习：下一轮学习与推进。现在暂停音频，完成学习单最后一部分。记录一次行动后出现的反复，说明已经观察到什么、哪些原因仍待核实。再写下一位参与者提出的实际担忧，想想需要补充什么事实或安排怎样的共同观察。最后确定一个后续行动、指导支持和回看日期。这是课程设计的练习，目的在于把困难转成可以学习和处理的具体问题，不要求立即为整个组织判定转型阶段。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S09 第一年.md#^llet-ch06-s09-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S07 “抗体”.md#^llet-ch06-s07-p008\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S02 浸入式管理.md#^llet-ch06-s02-p005", "image": "assets/slides/L19/05.png", "time": 207}, {"n": 6, "title": "单元回顾与下一站", "text": "单元回顾与下一站\n路线：领导学习 → 战略行动 → 持续回顾\n自测：一次好结果为何不足以证明完成？\n下一站：领导与文化\n战略与推进 · L19    6/6    原书第六章", "notes": "第6页。单元回顾与下一站。战略与推进单元可以沿一条路线回顾：领导者参与学习，共同说明方向，把目标落实为价值流行动，再通过持续回顾积累经验。自测一下，一次活动有好结果，为什么还不能证明整个组织完成转型？因为还要看结果是否保持、人员是否学会运用，以及新的工作方式是否持续。请保留学习单，选一项后续行动推进。下一单元领导与文化，将进一步讨论日常行为怎样支持这些变化长期保持。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S09 第一年.md#^llet-ch06-s09-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S09 第一年.md#^llet-ch06-s09-p002\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S13 本章总结.md#^llet-ch06-s13-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH06-S13 本章总结.md#^llet-ch06-s13-p002", "image": "assets/slides/L19/06.png", "time": 258}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L19_第06章_持续推进与转型阶段.pptx", "audio": "音频合集/L19_第06章_持续推进与转型阶段.mp3", "exercises": "# 战略与推进：我的工作学习单\n\n整理者设计，复制一份填写。沿用熟悉的工作问题；事实不明处标“待核实”。\n\n## L17：方向与支持\n\n- 工作问题及客户或组织方向：____\n- 为什么改变，为什么选择此方式：____\n- 预期效果（待验证）：____\n- 负责人、参与岗位、指导者与支持需求：____\n- 向谁核对理解，对方有哪些疑问：____\n\n## L18：目标、行动与回顾\n\n| 项目 | 我的记录 |\n|---|---|\n| 一项目标及对应指标、单位和现状 | |\n| 准备改变的价值流或步骤 | |\n| 一项具体行动及负责人 | |\n| 支持需求和回顾日期 | |\n| 实际结果与证据（行动后填写） | |\n| 原因：事实与待验证猜测分开 | |\n| 补救或下个月的行动 | |\n\n## L19：后续学习与推进\n\n- 一次反复及已经观察到的事实：____\n- 一项实际担忧，需要什么回答或共同观察：____\n- 需要谁指导，准备怎样学习：____\n- 下一步行动、负责人、回看日期：____\n\n## 我的总结\n\n- 学到的三个要点：____／____／____\n- 自测：局部成果为何不能直接等同整体转型完成？____\n- 我愿意推进的一个行动：____\n\n返回单元与知识入口 · L17 · L18 · L19\n", "duration": 311.50380952380954, "start": 5457.875192743764, "end": 5769.379002267574}, {"id": "L20", "title": "客户、尊重与面对问题", "chapter": "第07章", "source": "第7章", "unit": "领导与文化", "status": "媒体、内容复核及PPT逐页检查通过；音频待听审", "pages": [{"n": 1, "title": "文化体现在每天怎样做事", "text": "文化体现在每天怎样做事\n领导者的行为影响文化\n客户影响是讨论改善的起点\n三讲联系自己的日常工作\n领导与文化 · L20    1/6    原书第七章", "notes": "第1页。文化体现在每天怎样做事。本单元接着战略与推进，讨论怎样让改善成为日常工作方式。作者认为，企业文化与领导者的行事习惯密切相关，不能只靠口号来理解。三讲依次学习面对客户问题、现场学习与指导，以及行为怎样持续。请沿用前面的一项工作问题，观察自己或团队遇到问题时通常怎样反应。课程练习由整理者设计，帮助你选出一个能够改变的小行为，而不是立即评价整个企业的文化。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S01 定义企业文化.md#^llet-ch07-s01-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S03 服务客户／客户至上.md#^llet-ch07-s03-p001", "image": "assets/slides/L20/01.png", "time": 0}, {"n": 2, "title": "客户需要与真实信息", "text": "客户需要与真实信息\n讨论改变对客户有什么影响\n如实说明问题和不利事实\n承认还有可以做得更好的地方\n领导与文化 · L20    2/6    原书第七章", "notes": "第2页。客户需要与真实信息。原书把服务客户放在改善的出发点，同时强调信息可信。如果只报告好消息，团队就难以理解真实问题。作者还从谦逊谈到反省、挑战和改进：先承认还有可以做得更好的地方，才有继续学习的空间。联系工作时，可以说明一次交付对接收者产生了什么影响，再列出实际发生的事实。这样的表述是本课的应用安排，避免先把问题归结为某个人的态度。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S03 服务客户／客户至上.md#^llet-ch07-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S04 无论如何，寻找正确的.md#^llet-ch07-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S06 直面不足.md#^llet-ch07-s06-p002", "image": "assets/slides/L20/02.png", "time": 52}, {"n": 3, "title": "原书案例：HON/HNI的积极诚实", "text": "原书案例：HON/HNI的积极诚实\n诚信不仅意味着不说谎\n即使不利，也需要讲出事实\n问题得到说明，才有机会改进\n领导与文化 · L20    3/6    原书第七章", "notes": "第3页。原书案例：HON/HNI的积极诚实。作者在HON/HNI的经历中，把积极的诚实解释为，不仅不说谎，还要有人讲出事实，即使事实可能带来消极影响。同一段还用坏消息优先来说明如何看待新建议中的问题。本讲借这个历史实例理解诚实报告的价值，不把它解释为先批评每个人。说出问题以后，还需要用尊重的方式讨论不足，并帮助参与者改进。对自己的工作，可以先练习把一个不利事实说清楚。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S04 无论如何，寻找正确的.md#^llet-ch07-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S07 带着尊重，真诚表达.md#^llet-ch07-s07-p001", "image": "assets/slides/L20/03.png", "time": 101}, {"n": 4, "title": "尊重地反馈，充分理解问题", "text": "尊重地反馈，充分理解问题\n具体说明长处和不足\n理解问题之后再讨论方案\n五个为什么和A3是思考的帮助\n领导与文化 · L20    4/6    原书第七章", "notes": "第4页。尊重地反馈，充分理解问题。原书强调，诚实与尊重同样重要。主管既要了解团队成员的长处和不足，也要以敬意帮助他们面对和改进不足。解决问题时，作者提出先充分理解问题，再寻找有效方案，并介绍五个为什么与A3思维。本讲只说明它们帮助思考的用途，不把问满五次或填满固定格子当作原因已证实。应用时应核对事实，并让参与者说明实际过程；这一步是本课程的练习提醒。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S07 带着尊重，真诚表达.md#^llet-ch07-s07-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S05 谨慎决策，快速执行.md#^llet-ch07-s05-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S05 谨慎决策，快速执行.md#^llet-ch07-s05-p002", "image": "assets/slides/L20/04.png", "time": 155}, {"n": 5, "title": "工作练习：一次问题沟通", "text": "工作练习：一次问题沟通\n客户或接收者受到什么影响\n我知道哪些事实，哪些还不知道\n准备怎样尊重地提出问题\n领导与文化 · L20    5/6    原书第七章", "notes": "第5页。工作练习：一次问题沟通。现在暂停音频，打开共用学习单。记录最近一次让客户或下一岗位受影响的问题，分别写明已知事实和仍待了解之处。然后拟一句准备对同事说的话，例如这次资料少了一项，我想和你一起了解交接时发生了什么。这句话是教学情境，不是原书案例。练习重点是说清现象、保留询问空间，并商量下一步如何了解过程，不要求一次谈话就找出全部原因。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S03 服务客户／客户至上.md#^llet-ch07-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S07 带着尊重，真诚表达.md#^llet-ch07-s07-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S05 谨慎决策，快速执行.md#^llet-ch07-s05-p002", "image": "assets/slides/L20/05.png", "time": 206}, {"n": 6, "title": "小结：问题可以被诚实地讨论", "text": "小结：问题可以被诚实地讨论\n要点：关注客户、如实说明、尊重沟通\n自测：尊重是否意味着回避不足？\n行动：核对一次问题描述\n领导与文化 · L20    6/6    原书第七章", "notes": "第6页。小结：问题可以被诚实地讨论。本讲记住三个要点：先看客户受到什么影响，如实说明问题，以尊重的方式讨论不足。自测一下，尊重是否意味着不能指出问题？按原书的理解，尊重与真诚表达应同时做到，目的是帮助人认识和改进不足。你的一个行动，是请相关同事核对学习单中的事实，看看是否有误解或遗漏。下一讲继续到实际工作地点观察，并学习如何帮助他人积累解决问题的经验。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S03 服务客户／客户至上.md#^llet-ch07-s03-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S04 无论如何，寻找正确的.md#^llet-ch07-s04-p001\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S07 带着尊重，真诚表达.md#^llet-ch07-s07-p001", "image": "assets/slides/L20/06.png", "time": 256}], "timingNote": "按原课程近似时间表定位，可手动调整。", "ppt": "课件/L20_第07章_客户、尊重与面对问题.pptx", "audio": "音频合集/L20_第07章_客户、尊重与面对问题.mp3", "exercises": "# 领导与文化：我的工作学习单\n\n整理者设计。三讲沿用同一个工作问题，复制一份填写；没有把握处写“待了解”。\n\n## L20：一次诚实、尊重的问题沟通\n\n- 客户或接收者受到的影响：____\n- 已知事实与证据：____\n- 还不知道、需要询问的内容：____\n- 我准备怎样向同事描述问题：____\n- 对方的说明，以及我需要修正的理解：____\n\n## L21：一次共同观察与指导\n\n| 项目 | 我的记录 |\n|---|---|\n| 实际观察的过程和参与者 | |\n| 看到的事实 | |\n| 自己的猜测与待核实问题 | |\n| 需要谁指导或支持 | |\n| 下一步行动与回看日期 | |\n| 我或同事学会了什么 | |\n\n## L22：一个能持续的行为\n\n- 希望改变的日常做法：____\n- 出现什么情境时，准备采取什么行为：____\n- 与客户需要或组织方向有什么联系：____\n- 在哪里实践，需要谁支持：____\n- 用什么事实记录，什么时候回看：____\n- 回看后的进步、未做到之处及下一步：____\n\n## 我的总结\n\n- 三个要点：____／____／____\n- 自测：文化口号怎样成为可观察的行为？____\n- 愿意持续的一项行动：____\n\n返回单元与知识入口 · L20 · L21 · L22\n", "duration": 307.15632653061226, "start": 5769.379002267574, "end": 6076.535328798186}, {"id": "L21", "title": "现场学习、指导与日常改善", "chapter": "第07章", "source": "第7章；附录G选读", "unit": "领导与文化", "status": "媒体、内容复核及PPT逐页检查通过；音频待听审", "pages": [{"n": 1, "title": "现场观察帮助理解真实问题", "text": "现场观察帮助理解真实问题\n到实际工作地点看过程\n听取参与者的说明\n把观察与假设分开记录\n领导与文化 · L21    1/6    原书第七章", "notes": "第1页。现场观察帮助理解真实问题。上一讲已经练习描述问题，这一讲进一步了解它实际怎样发生。原书用现地现物说明，到真实工作地点观察真实事物，避免只根据远离现场的报告和会议作判断。练习时可以看一次完整交接，听参与者说明，并把看到的事实与自己的猜测分开记录。这是本课的简化观察方法。现场也可以是实际处理资料的位置，不要求为了形式安排一次与问题无关的参观。\n来源（Obsidian库内路径）：\n10_书籍/企业精益转型的领导之道/01_章节/CH07-S08 走、看、听和学习（现地现物）.md#^llet-ch07-s08-p001", "image": "assets/slides/L21/01.png", "time": 0}, {"n": 2, "title": "指导的结果体现在人的成长", "text": "指导的结果体现在人的成长\n培养人才是管理者的重要工作\n指导需要实践机会\n关注成员学会了什么\n领导与文化 · L21    2/6    原书第七章", "notes": "第2页。指导的结果体现在人的成长。作者描述丰田把人才培养放在重要位置，重视指导能力，并以团队成员的成长和发展说明指导的结果。由此理解，指导不是只替别人给答案，也需要让参与者获得实践经验。课程练习可以安排一次共同观察，请对方解释发现的问题，再商量下一步需要核对什么。这个练习形式由整理者设计。学习之后要回看对方能否更清楚地观察和说明问题，而不只是统计参加
